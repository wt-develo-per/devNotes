### Node.js Topic 5: Error Handling

In frontend React development, if a JavaScript error happens, usually just one button stops working or one component fails to load. The rest of the page stays completely alive for that user.

In Node.js, an unhandled error is catastrophic. Because Node.js processes JavaScript on a **single thread**, if an error breaks that one thread, **the entire server crashes for EVERY user currently connected to it**. 

---

#### 1. The Tightrope Walker Analogy

Imagine a circus tightrope walker performing high above the ground. If they slip and there is no safety net, the show is completely over. 
In Node.js, if your code throws an error and you don't catch it in a "safety net", the server dies instantly.

```mermaid

#### 2. Types of Errors in Node.js

There are two main categories of errors you will encounter:

1. **Operational Errors:** Expected problems that happen during the normal life of a server. For example: A user tries to upload a 10GB file, the database goes offline for a second, or a file isn't found on the hard drive. You must build logic to *handle* these gracefully.
2. **Programmer Errors:** Actual bugs in your code. For example: Trying to read `user.name` when `user` is `undefined`, or writing a syntax error. You cannot "handle" these; you must open your code editor and *fix* the bug.

---

#### 3. The Safety Nets (How to Catch Errors)

Depending on the style of code you are writing, you must use different safety nets to prevent server crashes.

##### Safety Net 1: Synchronous Code (try / catch)
For standard, line-by-line blocking code, wrap the dangerous part in a `try...catch` block.

```javascript
try {
  // Try to do something dangerous
  const data = JSON.parse("This is clearly not valid JSON format");
} catch (error) {
  // If it fails, the code jumps into this block instead of crashing!
  console.log("Caught an error:", error.message);
}
```

##### Safety Net 2: Asynchronous Promises (`.catch`)
If you are using Promises, a normal `try...catch` block will NOT work because the code moves on before the error happens in the background. You must attach a `.catch()` function to the end.

```javascript
// A database call that returns a Promise
fetchDataFromDatabase()
  .then(data => {
    console.log("Got the data:", data);
  })
  .catch(error => {
    // The safety net for Promises
    console.log("Database failed, but the server is still alive!", error.message);
  });
```

##### Safety Net 3: Async / Await (`try / catch`)
When using the modern `async` / `await` syntax, Node.js pauses execution, which allows you to go back to using the traditional `try...catch` block! This is the most popular way to write safe code today.

```javascript
async function getUserProfile() {
  try {
    // We 'await' the result, so try/catch works perfectly here
    const user = await database.findUser({ id: 1 });
    console.log(user);
  } catch (error) {
    console.log("Oops! Could not find user.", error.message);
  }
}
```

---

#### 4. The Ultimate Failsafe: `uncaughtException`

What happens if you completely forget to put a `try...catch` somewhere, and an error slips through? 

Node.js emits a global system event right before the server is about to crash. You can listen to this event to log the error to a file so you know what happened.

```javascript
// Catches normal synchronous errors that slipped through
process.on('uncaughtException', (error) => {
  console.log("CRITICAL: We forgot a try/catch!", error.message);
  process.exit(1); // Force the server to shut down safely
});

// Catches Promise errors (like a missing .catch())
process.on('unhandledRejection', (reason, promise) => {
  console.log("CRITICAL: Unhandled Promise Rejection!", reason);
  process.exit(1); 
});
```

> [!WARNING]
> **Never use `uncaughtException` to keep the server running.**
> Some developers try to use this event to ignore the error and force the server to stay online. This is a terrible idea! If an uncaught exception happens, your server is in an unpredictable, unstable state and might start corrupting user data or leaking memory. 
> 
> **Always let it crash.** Use an external tool (like PM2, Docker, or Kubernetes) to automatically restart a fresh, healthy copy of the server the moment it dies!
