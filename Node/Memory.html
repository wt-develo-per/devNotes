### Node.js Topic 4: Memory & Garbage Collection

Every time you create a variable, array, object, or function in your Node.js application, it takes up physical space in your server's RAM. 

Because Node.js is powered by Google's V8 Engine, V8 handles all memory management for you. It decides when to give out memory (allocation) and when to clean it up (de-allocation). 

However, if you don't understand how V8 does this, you can easily crash your entire server by causing a Memory Leak!

---

#### 1. The Memory Structure (Stack vs Heap)

V8 splits your server's memory into two distinct areas: **The Stack** and **The Heap**.

##### The Stack (Fast & Organized)
The Stack is incredibly fast, very organized, but limited in size. It stores **static data** (data where the computer knows exactly how much physical space it will take up). 
* Primitive types (`numbers`, `booleans`).
* **Pointers** (invisible arrows) that point to complex objects living over in the Heap.
* The execution context (the Call Stack we saw in the Event Loop).

##### The Heap (Large & Messy)
The Heap is massive, messy, and completely unorganized. It stores **dynamic data** (data that might grow, shrink, or change size over time).
* Objects (e.g., `{ name: "John", age: 30 }`)
* Arrays (e.g., `[1, 2, 3, 4, ...1000]`)
* Functions and massive string blocks

#### 2. The Garbage Collector (The Automatic Janitor)

In older languages like C or C++, the developer has to manually write code to say "Give me memory" and "Delete this memory". If you forget to write the delete code, your application eventually crashes.

In Node.js, V8 has a built-in **Garbage Collector (GC)**. 
Think of the GC as an automatic janitor that occasionally pauses your application for a fraction of a millisecond to sweep through the Heap. If it finds an object that is no longer being used (meaning no pointer in your Stack is pointing to it anymore), the GC automatically deletes it and frees up the RAM!

##### Visualizing Garbage Collection

```mermaid
graph TD
    subgraph Before ["Memory Before"]
        A["Stack: let user"] -->|"Points to"| B["Heap: {name: 'Alice'}"]
    end
    
    subgraph After ["Memory After (user = null)"]
        C["Stack: user = null"]
        D["Heap: {name: 'Alice'}"]
        C -.->|"Broken Link"| D
        
        Trash["Janitor sweeps Alice<br/>into the trash!"]
        D -.->|"Trash"| Trash
    end
    
    style D fill:#f2d7d5,stroke:#c0392b,stroke-width:2px
    style Trash fill:#fff,stroke:#c0392b,stroke-width:1px,stroke-dasharray: 5 5
```

* <span class="hinglish">Jab tak aapke variables (pointers) object se jude hain, wo safe hai. Par jaise hi aapne variable ko `null` kiya, pointer toot jata hai. V8 ka Janitor (Garbage Collector) dekhta hai ki "Arre, is object ko koi use nahi kar raha", aur wo usko turant kachre mein daal kar memory free kar deta hai!</span>

---

#### 3. What is a Memory Leak?

A memory leak happens when the Garbage Collector *wants* to clean up memory, but it *cannot*, because your code is accidentally still holding onto a reference (pointer) to it!

**The Garage Analogy:** You put a box of old files in your garage. You never intend to look at them again, but because you accidentally left a sticky note on the box labeled *"Important, Do Not Throw Away"*, the janitor refuses to touch them. Eventually, your garage gets completely full of old boxes, and you can't park your car anymore. 

##### Common Causes of Memory Leaks in Node.js:
1. **Global Variables:** Variables attached to the `global` object are never garbage collected because the application assumes you might need them at any time.
2. **Forgotten Timers:** If you set a `setInterval` that references large objects, but you never call `clearInterval()`, that interval will run forever, keeping those objects alive in memory forever.
3. **Event Listeners:** If you add an event listener (e.g., `emitter.on('data', myFunc)`) but never remove it (`emitter.removeListener`), the function and everything it touches will stay locked in memory!

> [!WARNING]
> By default, a Node.js process has a strict memory limit (usually around **1.5 GB** on a 64-bit system). If you leak memory and cross this limit, your entire application will instantly crash with the dreaded error: 
> `FATAL ERROR: CALL_AND_RETRY_LAST Allocation failed - JavaScript heap out of memory`.
