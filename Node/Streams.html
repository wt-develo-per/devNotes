### Node.js Topic 2: Streams

In Node.js, **Streams** are the ultimate weapon for handling massive amounts of data. They give you a way to read/write files or network communications in a continuous, piece-by-piece manner.

Instead of reading a massive 10GB file completely into your server's memory (RAM) before sending it to a user, Streams allow you to read a tiny 64kb "chunk" of the file, send it, and then grab the next chunk!

---

#### 1. The Netflix Analogy

When you watch a movie on Netflix, you don't download the entire 2-hour video to your phone before you hit play. That would take forever and use all your storage!

Instead, you *stream* it. Netflix sends you the first few seconds of video, your phone plays it, and while you are watching, Netflix is sending the next few seconds in the background.

* <span class="hinglish">Streams bilkul paani ki pipe ki tarah hote hain. Agar aapko 10,000 litre ki tanki bharni hai, toh aap pura 10,000 litre paani ek sath utha kar nahi le jaate (warna kamar toot jayegi). Aap ek pipe lagate ho, aur paani thoda-thoda karke continuous behta rehta hai jab tak tanki na bhar jaye. Node.js server bhi RAM ki 'kamar tootne' se bachane ke liye data ko thoda-thoda karke bhejta hai.</span>

---

#### 2. The Memory Problem (Visualized)

If we don't use streams, our Node.js server memory gets crushed under heavy loads. Notice what happens when you try to send a 10GB file to a user without streams!

```mermaid
graph TD
    subgraph BadWay ["❌ The Bad Way - Without Streams"]
        A1["💾 Hard Drive (10GB File)"] -->|"Reads ENTIRE file"| B1["🧠 Server RAM (10GB) - CRASH!"]
        B1 -->|"Attempts to send 10GB"| C1["💻 User Client"]
    end
    
    subgraph GoodWay ["✅ The Good Way - With Streams"]
        A2["💾 Hard Drive (10GB File)"] -->|"Reads 64kb Chunk"| B2["🛡️ Server RAM (64kb) - SAFE"]
        B2 -->|"Sends 64kb Chunk"| C2["💻 User Client"]
    end
    
    style B1 fill:#f2d7d5,stroke:#c0392b,stroke-width:2px
    style B2 fill:#d5f5e3,stroke:#27ae60,stroke-width:2px
```

#### 3. The Four Types of Streams

Node.js has four fundamental stream types:

1. **Readable Streams:** Used for reading data (e.g., `fs.createReadStream()`).
2. **Writable Streams:** Used for writing data (e.g., `fs.createWriteStream()`).
3. **Duplex Streams:** Can be both read from and written to simultaneously (e.g., a TCP network socket connection).
4. **Transform Streams:** A Duplex stream that can modify or transform the data as it passes through (e.g., `zlib.createGzip()` to zip and compress a file on the fly!).

---

#### 4. Connecting Streams: The `.pipe()` method

When you have a **Readable Stream** (data coming in) and you want to send that data directly to a **Writable Stream** (data going out), you connect them like plumbing a house: using a **pipe**.

If water is flowing out of a tap (Readable) and needs to go into a bucket (Writable), you connect a hose (`.pipe()`) between them. Node.js handles the flow of data automatically, ensuring the bucket doesn't overflow if the tap is running too fast!

##### Real-World Code Example
Let's look at how to serve a massive video file over a web server without crashing it.

```javascript
import fs from 'fs';
import http from 'http';

const server = http.createServer();

// ❌ THE BAD WAY (Do NOT do this for large files)
/*
server.on('request', (req, res) => {
  // fs.readFile loads the ENTIRE file into memory first!
  fs.readFile('./massive-movie.mp4', (err, data) => {
    if (err) throw err;
    res.end(data); // Then sends it all at once. Server crashes if file is > 2GB!
  });
});
*/

// ✅ THE GOOD WAY (Using Streams)
server.on('request', (req, res) => {
  // 1. Create a "tap" reading from the file on the hard drive
  const readableStream = fs.createReadStream('./massive-movie.mp4');
  
  // 2. The user's response object (res) is naturally a Writable Stream. 
  // We simply pipe the readable stream into the writable response!
  readableStream.pipe(res);
});

server.listen(3000, () => console.log("Stream Server listening..."));
```

> [!TIP]
> **Stream Events:** Under the hood, Streams are event emitters! If you don't want to use `.pipe()`, you can actually listen to exactly what is happening manually by attaching event listeners like `.on('data', chunk => ...)`, `.on('end')`, or `.on('error')` on your stream objects.
