### Node.js Topic 7: File Uploads & Multer

When a user submits a normal login form, the frontend sends a simple JSON object (like `{ "username": "John" }`) to your backend. Node.js can read this effortlessly using `express.json()`.

However, if a user uploads a **Profile Picture**, everything changes. You cannot put a 5MB image inside a JSON string. The frontend must send the data in a special format called **`multipart/form-data`**.

---

#### 1. The Problem with Multipart Data

Standard Express has no idea how to read `multipart/form-data`. If a user uploads an image, Express just sees a chaotic, unreadable stream of random binary data (0s and 1s) mixed together with text.

To solve this, we use a specialized Middleware package called **Multer**.

* <span class="hinglish">JSON bhejna ek simple postcard bhejney jaisa hai. Express aaram se padh leta hai. Par Image bhejna ek bada parcel (box) bhejney jaisa hai jiske andar packing peanuts aur alag-alag items bhare hain. Express ko samajh nahi aata is parcel ko kaise khole. `Multer` wo middleware hai jiske paas us parcel ko kholne ka aur image ko sahi jagah rakhne ka special tool hai!</span>

```mermaid
graph TD
    A["Frontend React App"] -->|"Sends JSON"| B["Express Backend"]
    A -->|"Sends multipart/form-data (Image)"| C{"Express is confused!"}
    
    B -.->|"express.json() handles it"| D["req.body"]
    
    C -->|"Pass it to Multer Middleware"| E["Multer opens the box"]
    E -->|"Extracts Image"| F["Saves to Hard Drive / Memory"]
    E -->|"Extracts Text"| D
    
    style C fill:#f2d7d5,stroke:#c0392b

```

---

#### 2. Using Multer in Express

Multer is the industry standard for handling file uploads in Node.js. 

First, you install it: `npm install multer`

There are two main ways to use Multer:
1. **Disk Storage:** Multer automatically saves the file to a folder on your server's hard drive.
2. **Memory Storage:** Multer holds the file in the server's RAM (Buffer) temporarily so you can send it somewhere else (like Amazon S3).

##### Example: Saving to Disk

```javascript
import express from 'express';
import multer from 'multer';

const app = express();

// 1. Configure Multer to save files to the 'uploads/' folder
const upload = multer({ dest: 'uploads/' });

// 2. Add the Multer middleware to your route
// 'profile_pic' MUST match the name attribute in the frontend HTML form!
app.post('/upload-avatar', upload.single('profile_pic'), (req, res) => {
  
  // Multer automatically adds a 'file' object to the request!
  console.log(req.file);
  /* Outputs: {
       fieldname: 'profile_pic',
       originalname: 'my_selfie.jpg',
       mimetype: 'image/jpeg',
       destination: 'uploads/',
       filename: 'f87a329...912a', // Random name to prevent overwriting
       size: 1048576
     }
  */

  // Any text fields sent with the image are automatically put in req.body
  console.log(req.body.username);

  res.send("File uploaded successfully!");
});
```

---

#### 3. The Modern Architecture (Cloud Storage)

In a real, large-scale company (like Netflix or Instagram), **you never save images to your Node.js server's hard drive (`dest: 'uploads/'`)**. 

Why? Because modern backends are spread across multiple servers (Server A, Server B, Server C). If a user uploads an image, and the Load Balancer sends it to Server A, it gets saved on Server A's hard drive. 
When the user refreshes the page, the Load Balancer might route them to Server B. Server B will look at its own hard drive, not find the image, and show a broken image link!

##### The Solution: Amazon S3 (Simple Storage Service)

Instead of saving to the local hard drive, you configure Multer to hold the image temporarily in **Memory (RAM)**. Then, you use an AWS package to upload that buffer straight to a central Cloud Bucket (like Amazon S3). 

* <span class="hinglish">Real companies kabhi apne Node server ke hard drive par photos save nahi karti. Wo Multer `MemoryStorage` use karti hain, photo ko hawa (RAM) mein hold karti hain, aur seedha AWS S3 cloud mein bhej deti hain. Phir database mein sirf us cloud ka URL save kar leti hain!</span>

```mermaid
sequenceDiagram
    participant User as 💻 User Client
    participant Node as 🟢 Node.js (Multer)
    participant AWS as ☁️ Amazon S3
    participant DB as 🗄️ Database

    User->>Node: 1. Uploads Image
    Note over Node: Multer holds Image<br/>in RAM Buffer
    Node->>AWS: 2. Node uploads Buffer to S3 Cloud
    AWS-->>Node: 3. S3 replies with public URL (e.g., s3.com/img123)
    Node->>DB: 4. Save { avatar: "s3.com/img123" } in DB
    Node-->>User: 5. Success!
```

> [!WARNING]
> **The Memory Limit Danger:** If you use Multer's `MemoryStorage` to hold files in RAM before uploading to AWS, you MUST set a file size limit! If a hacker tries to upload a 5GB video, Multer will try to load the entire 5GB into your server's RAM, causing an instant fatal crash!
> 
> *Always set limits:* `const upload = multer({ storage: multer.memoryStorage(), limits: { fileSize: 5 * 1024 * 1024 } }) // 5MB Limit`
