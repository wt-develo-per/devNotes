### Node.js Topic 1: Fundamentals (A Deep Dive)

What actually *is* Node.js? It is not a programming language, and it is not a framework. 

It is a **JavaScript Runtime Environment**.

Traditionally, JavaScript only lived inside web browsers. The browser (like Chrome) has an engine that takes JavaScript code and turns it into machine code. In Chrome, this is called the **V8 Engine**. In 2009, Ryan Dahl ripped the V8 engine out of Chrome, wrapped it in a C++ program, and called it Node.js. 

Because of this, JavaScript can now interact directly with the operating system—meaning it can read files, create servers, and talk to databases, just like Python or Java!

---

#### 1. The Core Pillars of Node.js

Node.js is built upon three foundational pillars. Understanding these is crucial to mastering backend development.

##### Pillar 1: The V8 Engine
At its core, Node.js is powered by Google's open-source V8 JavaScript engine. V8 is written in C++ and is incredibly fast because it compiles JavaScript directly into native machine code before executing it. Node.js provides a "wrapper" around V8, adding backend features like the file system API (`fs`) and network API (`http`).

##### Pillar 2: Single-Threaded
Most traditional backend languages (like Java or PHP) are **multi-threaded**. When a new user connects to a Java server, the server creates a brand new "thread" (a separate worker) just for that user. 1,000 users = 1,000 threads. This eats up a massive amount of RAM.

Node.js is **single-threaded**. It has exactly ONE main worker. Whether you have 1 user or 10,000 users, that single worker handles all of them. This makes Node.js insanely lightweight and memory-efficient.

> [!WARNING]
> Because it is single-threaded, you must never run "CPU-intensive" tasks (like complex mathematical calculations, image processing, or video rendering) on the main thread. If the single worker gets stuck doing heavy math, all other users on the website will be completely ignored until the math is done! Node.js is meant for I/O tasks (network/database), not CPU tasks.

##### Pillar 3: Asynchronous and Non-Blocking I/O
If Node.js only has one worker, how does it handle 10,000 users at once without making them wait? The answer is **Non-Blocking I/O**.

Imagine a restaurant:
* **Blocking (Synchronous):** The waiter takes an order, walks to the kitchen, and stands there staring at the chef until the food is ready. The waiter ignores all other customers in the restaurant.
* **Non-Blocking (Asynchronous):** The waiter (Node.js) takes an order, drops it off at the kitchen (the Operating System), and immediately walks to the next table to take another order! When the kitchen finishes the food, they ring a bell, and the waiter delivers it.

* <span class="hinglish">Node.js ek smart waiter hai. Jab usko koi database query milti hai, wo query OS ko dekar aage badh jata hai taaki dusre users ko serve kar sake. Jab database se data wapas aata hai, tab Node us data ko pakad kar user ko bhej deta hai. Wo kabhi khali nahi baithta!</span>

#### 2. Visualizing Non-Blocking I/O

Here is a Sequence Diagram showing exactly how Node.js handles a massive database query without blocking the main thread:

```mermaid
sequenceDiagram
    participant Client as 💻 User Client
    participant Node as 🟢 Node.js (Main Thread)
    participant OS as ⚙️ Operating System
    participant DB as 🗄️ Database

    Client->>Node: 1. Request Data (e.g. GET /profile)
    Note over Node: Takes the request,<br/>does not wait!
    Node->>OS: 2. Offload heavy DB query
    Node-->>Client: 3. Thread is instantly free for NEW requests!
    
    Note over OS: OS works in the background
    OS->>DB: 4. Query Database
    DB-->>OS: 5. Data returned
    
    OS->>Node: 6. Triggers Callback with Data
    Node->>Client: 7. Sends final Response back to User
```

#### 3. The Module System

Because Node.js projects can get huge, you must split your code into multiple files. Node.js uses **Modules** to do this.

There are two module systems you will encounter in the real world:

##### CommonJS (The Old Standard)
This is what Node.js used historically. You will see this in older tutorials.
```javascript
// Exporting (math.js)
const add = (a, b) => a + b;
module.exports = add;

// Importing (app.js)
const add = require('./math.js');
console.log(add(2, 2));
```

##### ES Modules (The Modern Standard)
This is the modern standard (the exact same syntax used in React and modern Frontend development).
```javascript
// Exporting (math.js)
export const add = (a, b) => a + b;

// Importing (app.js)
import { add } from './math.js';
console.log(add(2, 2));
```

> [!TIP]
> To use ES Modules (`import/export`) in a Node.js project, you must open your `package.json` file and add `"type": "module"`. Otherwise, Node.js will throw a syntax error!

#### 4. Hello World (Pure Node.js)

Here is what a fundamental web server looks like in pure Node.js, without any external packages like Express:

```javascript
// 1. Import the built-in HTTP module
import http from 'http';

// 2. Create the server
const server = http.createServer((request, response) => {
  // This function runs every single time a user visits the server
  
  // Set the response header (Tell the browser we are sending plain text)
  response.writeHead(200, { 'Content-Type': 'text/plain' });
  
  // Send the actual message
  response.end('Hello from Node.js!');
});

// 3. Tell the server to listen on port 3000
server.listen(3000, () => {
  console.log('Server is running on http://localhost:3000');
});
```
This simple script perfectly demonstrates the event-driven nature of Node.js. The server sits quietly, doing absolutely nothing, until the "request" event occurs, at which point it fires the callback function!
