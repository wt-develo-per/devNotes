### Linux Masterclass 3: Server Deployment

You have built a beautiful Node.js app on your laptop. It works perfectly on `localhost:3000`. Now, you need to push it to a live Linux server on AWS so the whole world can see it.

This file covers the 3 critical steps required to securely deploy a backend application.

---

#### 1. Connecting to the Server (SSH)

You cannot plug a keyboard into a cloud server sitting in an AWS data center in Virginia. You must connect to it remotely over the internet. We do this using **SSH (Secure Shell)**.

##### The Death of Passwords
In the early days, you would log into a server using a password. Hackers quickly built bots that would try millions of passwords per second (Brute Force attacks) until they guessed yours. 

Today, we use **SSH Keys**. 
When you create a server, AWS gives you a `.pem` file (Your Private Key). You keep this file on your laptop. The server holds the Public Key. 

* <span class="hinglish">Private Key aapke ghar ki chaabi (key) jaisi hai, aur Public Key darwaze ke lock jaisi hai. Jab aap login karte ho, toh server check karta hai ki kya aapki chaabi is lock mein fit hoti hai. Bina chaabi ke, duniya ka sabse bada hacker bhi login nahi kar sakta kyonki yahan password type karne ka koi option hi nahi hai!</span>

**The Connection Command:**
```bash
ssh -i my-secret-key.pem ubuntu@54.23.11.109
```
*(This logs you into the server at IP `54.23.11.109` as the user `ubuntu` using your private key).*

---

#### 2. Keeping the App Alive (PM2)

You are logged into the server. You type `node server.js`. Your app starts running! You close your laptop and go to sleep.

**10 minutes later, your boss calls you. The website is dead. Why?**

When you run a command in the terminal, it is tied to your active SSH session. The moment you close your laptop (disconnecting the SSH session), Linux immediately kills every program you were running!

##### The Solution: Background Process Managers (PM2)
To keep a Node.js app running forever in the background, we use a tool called **PM2**.

```bash
### Install PM2 globally on the server
npm install -g pm2

### Start your app in the background!
pm2 start server.js --name "my-backend"
```
Now, you can safely close your laptop. PM2 will keep the app running in the background forever. 

> [!TIP]
> **PM2 is also a medic!** If your Node.js app encounters a fatal error and crashes at 3:00 AM, PM2 will instantly notice the crash and automatically restart your app within 1 second! You can sleep peacefully.

##### Systemd & `systemctl` (The Native Linux Way)
While Node.js developers love PM2, Linux itself has a built-in Background Process Manager called **systemd**. You control it using the **`systemctl`** command.

You use `systemctl` to start, stop, and restart heavy services like Databases (Postgres/MySQL) and Web Servers (Nginx).

```bash
sudo systemctl start nginx    # Starts the Nginx server
sudo systemctl status nginx   # Checks if Nginx is healthy or crashed
sudo systemctl restart nginx  # Reboots Nginx to apply new configs
sudo systemctl enable nginx   # Tells Linux to auto-start Nginx if the whole server reboots!
```

---

#### 3. The Reverse Proxy (Nginx)

Your Node.js app is running securely in the background on Port 3000. 
But users don't type `http://mywebsite.com:3000` into Chrome. They just type `mywebsite.com`, which defaults to Port 80 (HTTP) or Port 443 (HTTPS).

**Why not just run Node.js directly on Port 80?**
1. Node.js is not optimized to handle millions of slow, malicious connections.
2. Node.js is not good at serving static files (like images or CSS).
3. Running on Port 80 requires `root` (God) privileges, which is incredibly dangerous if your Node app gets hacked!

##### The Solution: Nginx
Nginx (pronounced "Engine-X") is a legendary Linux web server. It is written in C and is ridiculously fast. 

We place Nginx at the absolute front of the server on Port 80. Nginx acts as a Security Guard. It catches every incoming request from the internet. If the request is safe, Nginx internally forwards it to your hidden Node.js app on Port 3000. 

This architecture is called a **Reverse Proxy**.

```mermaid
graph TD
    subgraph The Internet
        User1["Hacker (DDoS Attack)"]
        User2["Normal User"]
    end
    
    subgraph Linux Server
        Nginx{"Nginx (Port 80/443)<br/>The Security Guard"}
        Node["Node.js + PM2 (Port 3000)<br/>The Brain"]
    end
    
    User1 -->|"Malicious Traffic"| Nginx
    User2 -->|"Valid Request"| Nginx
    
    Nginx -.->|"Blocks Hacker immediately!"| User1
    Nginx -->|"Forwards safe request"| Node
    
    style Nginx fill:#d5f5e3,stroke:#27ae60
    style Node fill:#d4e6f1,stroke:#2980b9
```

* <span class="hinglish">Nginx ek club ke bahar khada Bouncer hai. Node.js andar baitha VIP Manager hai. Saari public (internet) sirf Bouncer se milti hai. Bouncer faltu logon ko bahar hi rok deta hai, aur sirf safe logon ko VIP Manager se milne deta hai. Node.js kabhi seedha internet ke samne nahi aata!</span>
