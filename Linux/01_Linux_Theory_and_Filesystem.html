### Linux Masterclass 1: Theory and Filesystem

Welcome to Linux! 

As a Backend Developer, you might write code on a Windows laptop, but 99% of the time, that code will eventually be deployed to a Linux server in the cloud (AWS, Azure, Google Cloud). 

If you don't understand how Linux works, you will be completely lost the moment your code leaves your laptop.

---

#### 1. Why Linux? (Linux vs. Windows)

When you buy a laptop, it has a beautiful Graphical User Interface (GUI) with a mouse, folders, and clickable icons. That GUI consumes massive amounts of RAM and CPU just to draw the screen.

When you rent a server on AWS, you don't want to waste expensive RAM drawing a desktop background! You want 100% of the server's power dedicated to your Node.js app. 
Therefore, **Linux servers have no GUI**. They are completely blank, black terminal screens. You control them entirely by typing text.

* <span class="hinglish">Windows ek luxury car ki tarah hai jisme AC, music system, aur leather seats hain. Linux server ek Formula 1 racing car ki tarah hai jisme koi luxury nahi hoti, sirf pure speed aur power hoti hai. Isliye saare backend servers Linux pe chalte hain!</span>

---

#### 2. The Linux Filesystem (The Tree)

In Windows, your files are split across different physical drives: `C:\`, `D:\`, `E:\`.
In Linux, **there are no drives**. Everything exists under one single giant tree, starting at the **Root Directory**, which is simply a forward slash: `/`.

##### The 4 Folders You Must Know
If you type `ls /` on a Linux server, you will see a bunch of scary-looking folders. You only need to care about four of them:

1. `/home`: This is the equivalent of `C:\Users\`. If your username is "ubuntu", your personal files live in `/home/ubuntu`.
2. `/etc`: (Pronounced "etsy"). This folder holds all system **Configurations**. If you want to change how Nginx or a database runs, you edit the text files in `/etc/`.
3. `/var`: Stands for "Variable data". This is where files that constantly grow in size live. Server **Logs** and **Databases** live in `/var`.
4. `/tmp`: Temporary files. If you reboot the server, everything inside `/tmp` is instantly deleted.

```mermaid
graph TD
    Root["/ (The Root)"] --> Home["/home"]
    Root --> Etc["/etc (Configs)"]
    Root --> Var["/var (Logs & Data)"]
    Root --> Tmp["/tmp (Deletes on reboot)"]
    
    Home --> User1["/home/ubuntu"]
    Home --> User2["/home/admin"]
    
    Etc --> Nginx["/etc/nginx"]
    Etc --> Ssh["/etc/ssh"]
    
    Var --> Log["/var/log"]
    Var --> Www["/var/www (Websites)"]

---

#### 3. The Golden Rule: "Everything is a File"

In Windows, a hard drive is a `Device`, a mouse is a `Device`, and a text document is a `File`.

In Linux, **Everything is a File**. 
If you plug a USB keyboard into a Linux server, Linux literally creates a text file for it in the `/dev` folder. If you want to see what the keyboard is doing, you can literally use the `cat` command to read the keyboard file as if it were a text document!

This makes Linux incredibly predictable. If you want to change *anything* on the server, you just find the text file for it and edit it.

---

#### 4. Users and Permissions (The "root" user)

Because servers are often accessed by multiple people, Linux has a very strict security model.

##### The "root" User (God Mode)
In Linux, there is a legendary user called `root`. The `root` user is the super-administrator. 
The `root` user can literally delete the entire operating system while the server is running (by typing `rm -rf /`). 

Because `root` is so dangerous, you should **never** log in as `root`. You should log in as a normal user (like `ubuntu`), and when you need God Mode for 5 seconds to install a package, you type **`sudo`** before your command.

* <span class="hinglish">`root` user server ka bhagwan (God) hota hai. Wo kuch bhi kar sakta hai. Par daily kaam ke liye hum normal insaan ban ke login karte hain. Jab hume koi special kaam (jaise software install karna) hota hai, toh hum command ke aage `sudo` lagate hain. `sudo` ka matlab hai: "Mujhe 5 minute ke liye God Mode ki shakti de do!"</span>

##### File Permissions (rwx)
Every single file and folder in Linux has 3 levels of security permissions:
* **r** (Read) - Can I look at the file?
* **w** (Write) - Can I edit the file?
* **x** (Execute) - Can I run the file as a program?

These permissions are assigned to 3 different groups of people:
1. **User (Owner):** The person who created the file.
2. **Group:** A specific team of people.
3. **World (Others):** Every other random person on the server.

* <span class="hinglish">Maan lo aapne ek secret script likhi hai. Aap us script ko `rwx` (Read, Write, Execute) permissions de sakte ho apne liye (User), aur baaki duniya (World) ke liye permissions ko `---` (kuch nahi) kar sakte ho, taaki koi aur usko dekh na sake! Hum commands wale file mein dekhenge ki isko `chmod` command se kaise set karte hain.</span>
