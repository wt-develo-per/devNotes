### Docker Masterclass 4: Real-World MERN Project

You understand the theory. You understand how to build a container. You understand how Compose works.
Now, let's put it all together to build the holy grail of modern web development: **Dockerizing a full MERN Stack (MongoDB, Express, React, Node).**

When you give this repository to a new developer, they won't need to install Node, they won't need to install MongoDB, and they won't need to run `npm install`. They just type ONE command, and the entire multi-tier app boots up!

---

#### 1. The Architecture & Folder Structure

A real-world project is split into a Monorepo containing a `frontend` folder, a `backend` folder, and a single `docker-compose.yml` file sitting in the root that glues them together.

```mermaid
graph TD
    Root["📁 my-mern-app/"]
    
    Comp["📄 docker-compose.yml"]
    
    Front["📁 frontend/ (React)"]
    FrontDF["📄 Dockerfile (Multi-stage)"]
    FrontCode["📄 src/App.js"]
    
    Back["📁 backend/ (Express)"]
    BackDF["📄 Dockerfile (Node Alpine)"]
    BackCode["📄 server.js"]
    
    Root --> Comp
    Root --> Front
    Root --> Back
    
    Front --> FrontDF
    Front --> FrontCode
    
    Back --> BackDF
    Back --> BackCode
    
    style Root fill:#f9e79f,stroke:#f39c12
    style Front fill:#a9cce3,stroke:#2980b9
    style Back fill:#d5f5e3,stroke:#27ae60
```

---

#### 2. The Backend Dockerfile (Express + Node)

Inside your `backend/` folder, you create this `Dockerfile`. Notice how we use the layer caching trick!

```dockerfile
### backend/Dockerfile
FROM node:18-alpine

WORKDIR /usr/src/app

### Layer Caching: Copy package.json first
COPY package*.json ./
RUN npm install

### Copy the rest of the backend code
COPY . .

### Expose the Express port
EXPOSE 5000

### Start the server
CMD ["npm", "start"]
```
*(Don't forget to create a `backend/.dockerignore` file containing `node_modules`!)*

---

#### 3. The Frontend Dockerfile (React + NGINX)

Inside your `frontend/` folder, you create this `Dockerfile`. 
* <span class="hinglish">React ek "client-side" library hai. Jab aap React ko production me build karte ho (`npm run build`), toh wo sirf ek `index.html` aur thodi si `.js` files banata hai. Production me aapko Node.js server ki zaroorat nahi hoti frontend chalane ke liye! Isliye hum **Multi-Stage Build** use karte hain aur React ko **NGINX** (ek bahut fast aur halka web server) ke andar daal dete hain!</span>

```dockerfile
### frontend/Dockerfile

### --- STAGE 1: Build the React App ---
FROM node:18-alpine AS builder
WORKDIR /app
COPY package*.json ./
RUN npm install
COPY . .
RUN npm run build 
### (This creates a /app/build folder containing static HTML/JS)

### --- STAGE 2: Serve the App using NGINX ---
FROM nginx:alpine
### Copy the built HTML files from Stage 1 into NGINX's serving folder
COPY --from=builder /app/build /usr/share/nginx/html

### Expose port 80 (Standard HTTP port)
EXPOSE 80

CMD ["nginx", "-g", "daemon off;"]
```

---

#### 4. The Master Orchestrator: `docker-compose.yml`

This file sits in the **root** folder. It boots up the Frontend, the Backend, AND downloads MongoDB instantly!

```yaml
version: '3.8'

services:
  # 1. The Database (MongoDB)
  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db # Prevents data loss if container dies

  # 2. The Backend (Node.js)
  backend:
    build: ./backend # Tells compose where the backend Dockerfile is!
    ports:
      - "5000:5000"
    environment:
      # Notice how it connects to the 'mongo' service by its NAME!
      MONGO_URI: mongodb://mongo:27017/my_database
    depends_on:
      - mongo # Don't start until MongoDB is fully running

  # 3. The Frontend (React)
  frontend:
    build: ./frontend # Tells compose where the frontend Dockerfile is!
    ports:
      - "3000:80" # Map localhost:3000 to NGINX's port 80
    depends_on:
      - backend # Don't start until Backend is ready

volumes:
  mongo-data: # Declaring the persistent volume for MongoDB
```

* <span class="hinglish">Ab socho ek naya intern aapki company join karta hai. Use sirf `git clone` karna hai aur terminal me `docker-compose up` likhna hai. Docker khud React compile karega, Node set up karega, MongoDB download karega, aur un teeno ko aapas me connect kar dega! Magical, right?</span>

---

#### 5. 10 Real-World MERN Docker Scenarios & Best Practices

How do Senior Developers optimize this MERN stack in production?

##### Example 1: Fixing MongoDB Data Wipeouts
**Problem:** If the `mongo` container crashes or is deleted, all your users and products are deleted instantly.
**Solution:** Notice the `volumes: - mongo-data:/data/db` line in the Compose file. This creates a persistent "wormhole". Even if the MongoDB container is completely nuked, the database files are saved securely on your host machine's hard drive!

##### Example 2: Hot-Reloading for Development
**Problem:** If you edit a React component, you have to rebuild the entire Frontend Image (which takes 2 minutes) just to see the button turn red.
**Solution:** In development, do NOT use the NGINX multi-stage build. Use `volumes: - ./frontend:/app` in your Compose file. This syncs your laptop's folder with the container instantly. You hit "Save" in VSCode, and React Hot-Reloads immediately inside Docker.

##### Example 3: Handling CORS Properly
**Problem:** Your React app (running on Port 3000) tries to call the Node app (Port 5000). The browser throws a fatal `CORS Error`.
**Solution:** The React app is running inside the *user's browser*, not inside the Docker network! React must call `http://localhost:5000/api/users` (your public laptop IP), NOT `http://backend:5000` (the internal Docker network DNS). *Only containers* can use internal DNS.

##### Example 4: Protecting the Database from Hackers
**Problem:** You opened Port `27017:27017` in the compose file. Hackers on the internet can now brute-force your MongoDB.
**Solution:** In production, remove `ports: ["27017:27017"]` completely. The database is now invisible to the internet. But because of Docker Networks, the `backend` container can still securely talk to `mongo:27017` internally!

##### Example 5: Injecting React Environment Variables
**Problem:** React needs to know the API URL. But React is compiled into static HTML *during the build process*. You cannot pass `.env` files to NGINX at runtime!
**Solution:** You must pass the variables during the `docker build` phase using `--build-arg REACT_APP_API_URL=https://api.mywebsite.com`. 

##### Example 6: Initializing MongoDB with Fake Data
**Problem:** Every time you spin up a fresh environment, the database is completely empty, making it hard to test the UI.
**Solution:** Map a local script `mongo-init.js` to `/docker-entrypoint-initdb.d/` inside the Mongo container. The moment MongoDB boots up for the first time, it will automatically run your script to create Admin users and dummy products!

##### Example 7: The Double `npm install` Trap
**Problem:** You run `npm install` on your Windows laptop. Then you mount your volume to the container (`./backend:/usr/src/app`). The container crashes.
**Solution:** Your volume mount just overwrote the container's Linux `node_modules` with your Windows `node_modules`! To fix this, use an "anonymous volume" in compose: `- /usr/src/app/node_modules`. This protects the container's modules from being overwritten by your laptop.

##### Example 8: Waiting for MongoDB to be "Ready"
**Problem:** `depends_on: - mongo` only waits for the Mongo *container* to start. But MongoDB takes 3 seconds to actually initialize the database. The Node app crashes instantly saying "Connection Refused".
**Solution:** Implement connection retry logic inside your Node.js `mongoose.connect()` function, or use a tool like `wait-for-it.sh` inside the Dockerfile.

##### Example 9: Reducing MERN Image Sizes
**Problem:** Your backend and frontend images combined are 2 GBs. Pushing this to AWS takes 10 minutes.
**Solution:** Using `node:18-alpine` for the backend and `nginx:alpine` for the frontend (Multi-stage build) reduces the entire MERN stack to under **200 MB combined**!

##### Example 10: Running Production in Detached Mode
**Problem:** You SSH into your AWS server, run `docker-compose up`, and then you close your SSH terminal. The website instantly goes offline!
**Solution:** Always use `docker-compose up -d` (Detached mode). It runs everything silently in the background, allowing you to close your terminal safely. If you need to see the `console.log` statements later, just type `docker-compose logs -f`.
