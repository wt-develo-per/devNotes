### Docker Masterclass 3: Compose & Networks

So far, we have only run 1 single container (our Node.js app).
But real applications require 3 things working together: A Node.js Backend, a PostgreSQL Database, and a Redis Cache. 

To run these manually, you would have to type 3 massive commands in 3 different terminal windows every time you boot your computer. 
**Docker Compose** solves this.

---

#### 1. The `docker-compose.yml` File (The Orchestrator)

Docker Compose is a tool that allows you to define multiple containers in a single `YAML` file. With one single command (`docker-compose up`), it boots up the database, the cache, and the backend perfectly synchronized!

```yaml
version: '3.8'

services:
  # 1. The Database Service
  postgres-db:
    image: postgres:15
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"

  # 2. The Backend Service
  node-backend:
    build: . # Tells Docker to use the Dockerfile in this folder
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://myuser:secretpassword@postgres-db:5432/mydb
    depends_on:
      - postgres-db # Wait for the DB to start before starting Node!
```

* <span class="hinglish">Bina Compose ke, har subah laptop kholkar aapko 3 lambi lambi commands yaad rakhni padti aur chalani padti. Compose ek "Conductor" ki tarah hai. Aap bas ek file mein likh do ki aapko kya kya chahiye, aur `docker-compose up -d` marte hi saari services background mein start ho jayengi!</span>

---

#### 2. Docker Networks (Internal DNS)

If you look closely at the `DATABASE_URL` in the file above, you will notice something weird.
`postgres://myuser:secretpassword@postgres-db:5432/mydb`

The host is not `localhost`. The host is `postgres-db`. Why?
Because Docker automatically creates an **Internal Network (A private LAN)** for your containers. 

```mermaid
graph TD
    subgraph "Docker Internal Network (Isolated)"
        A["node-backend (Container)"]
        B["postgres-db (Container)"]
        C["redis-cache (Container)"]
        
        A <-->|Communicates via internal DNS 'postgres-db'| B
        A <-->|Communicates via internal DNS 'redis-cache'| C
    end
    
    Hacker["Hacker on the Internet"] -.->|Blocked! Cannot access DB directly| B
    Hacker -->|Allowed access to Port 3000| A
    
    style A fill:#d5f5e3,stroke:#27ae60
    style B fill:#fad7a1,stroke:#d35400
    style C fill:#fad7a1,stroke:#d35400
```

* <span class="hinglish">Sabse best feature Docker Networks ka yeh hai ki containers ek dusre se apne "Naam" se baat karte hain! Agar Node ko Postgres se connect karna hai, toh IP address (localhost) yaad rakhne ki zaroorat nahi, wo seedha uske naam `postgres-db` pe call karega. Aur yeh sab ek private secure network me hota hai, jahan bahar se koi hacker database tak nahi pohoch sakta.</span>

---

#### 3. Volumes (The Hot-Reloading Secret)

If you bake your code into a Docker Image, what happens when you edit `server.js` on your laptop? Nothing. You have to stop the container, run `docker build` (which takes time), and run it again. This makes local development painfully slow.

**The Solution: Volumes.**
A volume is a bridge (wormhole) between a folder on your Windows laptop and a folder inside the Linux container.
When you change `server.js` on your laptop, the file instantly changes *inside* the running container! Combine this with `nodemon`, and you get instant Hot-Reloading without ever rebuilding the image!

```yaml
  node-backend:
    build: .
    volumes:
      # Map the current laptop folder (./) to the container folder (/app)
      - ./:/app
```

---

#### 4. Real-World Scenarios (10 Practical Examples)

Here is how Senior Backend Developers use Docker Compose.

##### Example 1: One-Click QA Environments
**Problem:** The QA team needs to test a specific branch of code, but setting up the DB and backend on their machine takes hours.
**Solution:** You give them the `docker-compose.yml` file. They type `docker-compose up` and instantly have a perfect replica of the entire production stack running locally.

##### Example 2: Keeping the Database Safe (No Exposed Ports)
**Problem:** You don't want hackers brute-forcing your Postgres database over the internet.
**Solution:** In `docker-compose.yml`, you remove the `ports: ["5432:5432"]` line from the Postgres service. Now, the database is completely invisible to the outside world, but the Node container can still talk to it internally!

##### Example 3: Persisting Database Data
**Problem:** When a container is deleted, everything inside it is deleted. If you delete the Postgres container, you lose all your users!
**Solution:** Use Named Volumes. `volumes: - pgdata:/var/lib/postgresql/data`. This saves the raw database files securely on your laptop's hard drive so they survive container destruction.

##### Example 4: Passing `.env` Files
**Problem:** You have 50 secret API keys. Writing them directly in the `docker-compose.yml` file is dangerous because it gets pushed to GitHub.
**Solution:** Use `env_file: - .env`. Docker will automatically suck up all the secrets from your local `.env` file and inject them securely into the container.

##### Example 5: Creating an Isolated Test DB for Unit Tests
**Problem:** Your Jest unit tests are polluting your local development database.
**Solution:** Add a 3rd service to Compose called `test-db`. When running tests, tell Jest to connect to `test-db` instead of `postgres-db`. When tests finish, you can easily wipe the `test-db`.

##### Example 6: Startup Ordering (`depends_on`)
**Problem:** The Node backend starts up faster than Postgres. Node tries to connect to the DB, fails, and crashes before Postgres even finishes booting.
**Solution:** Use `depends_on`. It forces Docker to wait and only start the Node container *after* the Postgres container is fully running.

##### Example 7: Simulating Microservices
**Problem:** Your company uses 5 different backend APIs (Auth API, Payments API, Search API) that all need to talk to each other.
**Solution:** Docker Compose is perfect for Microservices. You define all 5 APIs as separate services in one `yaml` file. They all boot up together and talk to each other via internal DNS (e.g., `http://auth-api:3000`).

##### Example 8: Seeding the Database on Boot
**Problem:** When you start a fresh DB container, it has no tables.
**Solution:** Postgres Docker images have a special feature. You can mount a `init.sql` file into `/docker-entrypoint-initdb.d/`. When the DB boots for the first time, it automatically runs your SQL file to create all the tables!

##### Example 9: Memory Limits in Compose
**Problem:** Your local Elasticsearch container uses 4GB of RAM and makes your laptop lag.
**Solution:** In Compose, under the service, add `mem_limit: 1g`. It restricts the container from ever exceeding 1GB of RAM.

##### Example 10: Tearing Everything Down
**Problem:** You are finished working for the day. You have 3 containers running, 1 network, and 2 volumes. You want to shut it all down cleanly.
**Solution:** Just type `docker-compose down`. It gracefully stops all containers, deletes the internal network, and cleans up everything in exactly 2 seconds!
