### Email Masterclass 1: Fundamentals & Nodemailer

Sending emails in Node.js is incredibly easy thanks to the `nodemailer` package.
However, doing it *securely* and *efficiently* in a production environment is where Junior Developers make massive mistakes.

---

#### 1. The Gmail Trap

When learning Node.js, every tutorial teaches you to use your personal `@gmail.com` account and an "App Password" to send emails.
**NEVER DO THIS IN PRODUCTION!**

1. **Rate Limits:** Gmail restricts you to sending 500 emails per day. If you have 2,000 users, your app will literally break.
2. **Spam Filters:** If you send automated promotional emails from a personal `@gmail.com` address, Google and Yahoo will flag you as a Spammer. Your emails will go straight to the user's Junk folder!

**The Senior Solution:** You must use a Transactional Email Provider (like **SendGrid**, **AWS SES**, or **Resend**). You verify your actual domain (`noreply@yourcompany.com`) and they handle the heavy lifting to ensure your emails reach the Inbox.

* <span class="hinglish">Personal Gmail se automated emails bhejna aisa hai jaise apni personal cycle par courier company khol lena. Thodi der baad thak jaoge (rate limits) aur log aapko serious nahi lenge (spam folder). AWS SES ya SendGrid ek proper Delivery Truck ki tarah kaam karte hain!</span>

---

#### 2. Basic Nodemailer Implementation

Here is how you connect `nodemailer` to a professional SMTP server (like SendGrid or AWS SES).

```javascript
import nodemailer from 'nodemailer';

// 1. Create the Transporter (The Engine)
const transporter = nodemailer.createTransport({
    host: "smtp.sendgrid.net",
    port: 587,
    auth: {
        user: "apikey", // Literally the string "apikey" for SendGrid
        pass: process.env.SENDGRID_API_KEY
    }
});

// 2. The sending function
const sendWelcomeEmail = async (userEmail, userName) => {
    try {
        const info = await transporter.sendMail({
            from: '"My SaaS App" <noreply@mysaas.com>',
            to: userEmail,
            subject: "Welcome to our Platform!",
            text: `Hello ${userName}, welcome aboard!`,
            html: `<b>Hello ${userName}</b>, welcome aboard!` // HTML takes priority!
        });
        console.log("Email sent! Message ID: ", info.messageId);
    } catch (error) {
        console.error("Failed to send email:", error);
    }
};
```

---

#### 3. Real-World Scenarios (10 Practical Examples)

How do massive companies handle email infrastructure?

##### Example 1: The Express Blocking Problem (CRITICAL)
**Problem:** In your `/register` route, you write `await sendWelcomeEmail()`. Sending an email takes 2 seconds over the network. The user clicks "Signup" and stares at a loading spinner for 2 seconds. The Node.js event loop is blocked!
**Solution:** Do not `await` it in the controller! Offload it to a Background Queue (which we will learn in File 02). The API should respond in 0.01s, and the email sends in the background!

##### Example 2: HTML Email Templates
**Problem:** Sending raw text emails looks terrible. You want to send a beautiful branded email with your company logo and a blue "Click Here" button.
**Solution:** Do not write HTML inside your Javascript files! Use a templating engine like **EJS** or **Handlebars**. Create a `welcome.ejs` file, inject the `userName` variable, compile it to an HTML string, and pass it to `nodemailer.html`.

##### Example 3: The "Forgot Password" Flow
**Problem:** How do you securely reset a password via email?
**Solution:** 
1. Generate a random 32-character token (using `crypto.randomBytes`).
2. Save `{ token, user_id, expires_at: NOW + 15 mins }` in the DB.
3. Send an email with a link: `https://yourapp.com/reset-password?token=abcd...`
4. When the user clicks the link, verify the token in the DB!

##### Example 4: Sending Attachments (Invoices)
**Problem:** A user pays $50. You need to email them a PDF Invoice.
**Solution:** Nodemailer makes this easy. Inside `sendMail`, add the `attachments` array:
`attachments: [{ filename: 'invoice.pdf', path: '/tmp/invoice.pdf' }]`

##### Example 5: Hiding Recipients (BCC)
**Problem:** You are sending a Newsletter to 5,000 users. You put all 5,000 emails in the `to:` field. Every user can see the email addresses of the other 4,999 users! (Massive Privacy Violation).
**Solution:** Put your own email in the `to:` field. Put the 5,000 users in the `bcc:` (Blind Carbon Copy) field. Or better yet, use a Queue to send 5,000 separate emails.

##### Example 6: Email Verification (Double Opt-In)
**Problem:** A hacker signs up with `elonmusk@tesla.com`. You start sending spam to Elon Musk!
**Solution:** When a user registers, their database status is `VERIFIED: FALSE`. You send an email containing a secure verification link. They cannot log in until they click that link, proving they actually own the inbox.

##### Example 7: Handling "Bounces"
**Problem:** A user makes a typo during registration: `john@gmaill.com`. You send the email, but it fails to deliver (Bounces). If you get too many bounces, SendGrid bans your account!
**Solution:** Setup a "Webhook" with SendGrid. When an email bounces, SendGrid hits your API `POST /api/webhooks/bounces`. Your backend reads the webhook, finds the user in Postgres, and marks their account as `EMAIL_INVALID`.

##### Example 8: Tracking Opens and Clicks
**Problem:** The Marketing team wants to know if users are actually reading the weekly newsletter.
**Solution:** SendGrid automatically injects an invisible 1x1 pixel image into the HTML email. When the user opens the email, their browser downloads the pixel, allowing SendGrid to track the "Open Event".

##### Example 9: Fallback Transporters (High Availability)
**Problem:** AWS SES goes down globally for 2 hours. Your startup cannot send any registration emails.
**Solution:** Create two Transporters in your code (e.g., Primary: AWS SES, Backup: SendGrid). In your try/catch block, if AWS SES throws an error, automatically trigger the Backup SendGrid transporter!

##### Example 10: Environment Spoofing (Development Testing)
**Problem:** You are coding on your local laptop. You create a test user `test@test.com`. Your code accidentally sends a real email to that fake address, wasting money and ruining your sender reputation!
**Solution:** Use **Mailtrap** or **Ethereal Email** for local development. `if (process.env.NODE_ENV === 'development') { useMailtrapTransporter() }`. Mailtrap catches the emails in a fake inbox so they never reach the real internet!
