### Logging Masterclass 1: Fundamentals

When your code is running on your local laptop, if it crashes, you can see the red text in your terminal. 
But when your code is deployed to a Linux server on AWS, and it crashes at 3:00 AM while you are sleeping... how will you ever know what went wrong?

**Logs are the black box of your airplane.** If the plane crashes, the logs tell you why.

---

#### 1. The Death of `console.log()`

Every Junior Developer uses `console.log("User logged in")`. Here is why Senior Developers NEVER use it in production:

1. **It is slow:** `console.log` is a synchronous, blocking operation. Writing plain text to a terminal slows down your Node.js event loop.
2. **It is unstructured:** It just spits out raw text. You cannot search, filter, or analyze raw text easily when you have 10 million lines of logs.
3. **It lacks severity:** Is this a fatal error? Or just a random info message? `console.log` doesn't care.

* <span class="hinglish">Jab aap `console.log` use karte ho, toh Node.js ko rukna padta hai text print karne ke liye. Production me humein ek aisi cheez chahiye jo background me chup-chap logs likhti rahe bina server ko slow kiye. Isliye hum **Winston** ya **Pino** jaisi libraries use karte hain.</span>

---

#### 2. Structured Logging (The JSON Format)

In modern backend engineering, **every single log must be a JSON object.**

If your log is a string: `"User 123 failed to login from IP 192.168.1.1"`
You can't write a query to find all failed logins from that IP!

If your log is JSON:
```json
{
  "level": "error",
  "message": "User failed to login",
  "userId": 123,
  "ipAddress": "192.168.1.1",
  "timestamp": "2026-06-30T10:00:00Z"
}
```
Now you can write a database query: `SELECT * FROM logs WHERE ipAddress = '192.168.1.1' AND level = 'error'`.

---

#### 3. Log Levels (Severity)

You must categorize your logs into "Levels". Winston and Pino use these standard levels:

1. **ERROR (0):** The system crashed. The database is down. (Wakes you up at 3 AM).
2. **WARN (1):** Something weird happened, but the system survived. (e.g., An API took 5 seconds to respond).
3. **INFO (2):** Normal system behavior. (e.g., "User John signed up").
4. **DEBUG (3):** Deep developer details. (e.g., "SQL Query: SELECT * FROM users"). Never turned on in Production!

```javascript
import winston from 'winston';

const logger = winston.createLogger({
    level: 'info', // Only log INFO, WARN, and ERROR. Ignore DEBUG.
    format: winston.format.json(), // Structured JSON!
    transports: [
        new winston.transports.File({ filename: 'error.log', level: 'error' }),
        new winston.transports.File({ filename: 'combined.log' })
    ]
});

// Instead of console.log...
logger.info("New user registered", { userId: 55, email: "john@doe.com" });
logger.error("Database connection failed!", { errorCode: 500 });
```

---

#### 4. Real-World Scenarios (10 Practical Examples)

How do massive companies handle logging in Node.js?

##### Example 1: Environment-Based Filtering
**Problem:** You want to see massive amounts of `DEBUG` logs while coding on your laptop, but you don't want to fill up your AWS server's hard drive with useless debug logs.
**Solution:** Dynamically set the log level based on `.env`. `level: process.env.NODE_ENV === 'production' ? 'info' : 'debug'`.

##### Example 2: Masking Sensitive Data (PII)
**Problem:** A junior dev writes `logger.info("Payment success", { requestBody: req.body })`. The user's Credit Card number and Password just got saved into a plain text file on your server! This is illegal.
**Solution:** Configure a "Redactor" in your logger (like `pino-noir`). It automatically intercepts words like `password`, `credit_card`, or `token` and replaces them with `******` before writing to the file!

##### Example 3: Automatic Log Rotation
**Problem:** You save all logs to `app.log`. After 6 months, the file becomes 50 GB. The server runs out of disk space and completely crashes!
**Solution:** Use `winston-daily-rotate-file`. It automatically creates a new file every midnight (e.g., `app-2026-06-30.log`). If a file gets older than 14 days, it automatically deletes it!

##### Example 4: Uncaught Exception Catchers
**Problem:** Your Node.js app crashes because of an unhandled Promise rejection. The server dies silently, and you have no idea why.
**Solution:** Tell Winston to catch fatal errors. `winston.exceptions.handle(new winston.transports.File({ filename: 'exceptions.log' }));`. It will capture the exact line of code that killed the server right before it dies.

##### Example 5: Splitting Error Logs
**Problem:** You have a 1GB file full of `INFO` logs, and you are trying to find the one `ERROR` that happened yesterday.
**Solution:** Notice the Winston code above! We created *two* transports. One saves EVERYTHING to `combined.log`, and the other saves ONLY errors to `error.log`. Finding bugs becomes 10x faster.

##### Example 6: Adding Meta-Data via Middleware
**Problem:** You want every single log to include the user's IP Address, but writing `{ ip: req.ip }` in 500 different `logger.info()` calls is annoying.
**Solution:** Use Express Middleware! Attach a custom logger to the request object: `req.logger = logger.child({ ip: req.ip, method: req.method })`. Now every log in that route automatically includes the IP!

##### Example 7: The "Slow Query" Logger
**Problem:** Your API is slow, but you don't know which specific database query is causing the bottleneck.
**Solution:** Write a wrapper around your Postgres query function. If the query takes more than 500ms, trigger a `logger.warn("Slow Query Detected", { sql, duration: 600 })`.

##### Example 8: Pino for Extreme Performance
**Problem:** Winston is great, but creating JSON strings is CPU-heavy. In a system handling 50,000 requests per second, Winston slows you down.
**Solution:** Switch to `Pino`. Pino is widely considered the fastest logger in Node.js because it minimizes JSON stringification overhead and uses worker threads to write to the disk asynchronously!

##### Example 9: Logging Third-Party Failures
**Problem:** Your user tries to pay, but the Stripe API is down. You throw a generic 500 error to the user, but you have no idea Stripe was the culprit.
**Solution:** Always wrap Axios calls in `try/catch`. `catch(err) { logger.error("Stripe API Failed", { stripeError: err.response.data }) }`. You need proof it was Stripe's fault, not yours!

##### Example 10: The "Heartbeat" Log
**Problem:** Your background worker server crashes silently. Since it has no web traffic, nobody notices it's dead for 3 days.
**Solution:** Write a `setInterval` that fires every 60 seconds: `logger.info("Worker Heartbeat: I am alive", { activeJobs: 5 })`. If your monitoring system stops seeing heartbeats, it pages you immediately!
