##### AWS S3 Masterclass 3: The Step-by-Step Console Guide

<span class="hinglish">Architecture samajhna aasan hai, par AWS Console me ghoumna ek bhool-bhulaiya (maze) jaisa hai. Ek choti si galti aur aapki saari images private ho jayengi ya fir hackers ko mil jayengi.
Is guide me hum step-by-step dekhenge ki ek Public Image hosting Bucket exactly kaise banani hai!</span>

---

###### Step 1: Create an IAM User (Never use Root!)

<span class="hinglish">Aapne jis Email aur Password se AWS account banaya hai, wo aapka **Root Account** hai. Iske paas poore AWS ko delete karne ki power hoti hai! Kabhi bhi Root account ki Access Keys generate karke apne Node.js code me nahi daalni chahiye!</span>

1. AWS Search bar me likhein **IAM** (Identity and Access Management).
2. Left menu se **Users** par click karein aur **Create user** karein.
3. Naam dein: `my-backend-api-user`.
4. Permissions me choose karein: **Attach policies directly**.
5. Search karke select karein: `AmazonS3FullAccess`. (Iska matlab ye user sirf S3 access kar sakta hai, EC2 ya Database delete nahi kar sakta!).
6. User banne ke baad uspar click karein -> **Security credentials** tab me jayein -> **Create access key** karein.
7. Dono Keys (Access Key aur Secret Key) copy karke ek text file me save kar lein. (Secret key dobara kabhi nahi dikhegi!).

---

###### Step 2: Create the S3 Bucket

1. AWS Search bar me likhein **S3**.
2. **Create bucket** par click karein.
3. **Bucket name:** Ek ajeeb sa unique naam dein (jaise `my-awesome-startup-images-2026`). Yaad rahe, kisi aur ne ye naam liya hoga toh error aayega!
4. **AWS Region:** Dropdown se `ap-south-1 (Mumbai)` select karein (Agar aapke users India me hain, toh photo download speed 10x fast hogi).

---

###### Step 3: Unblock Public Access

<span class="hinglish">Agar aap Profile Pictures ya e-commerce ke product images host kar rahe hain, toh unhe duniya ko dikhana zaroori hai.</span>

1. Nayi bucket banate time neeche ek section aayega: **Block Public Access settings for this bucket**.
2. Wahan ek tick laga hoga "Block *all* public access". Usko **UNCHECK** kar dein!
3. Ek danger warning aayegi, usme tick lagakar acknowledge karein.
4. Sabse neeche jaakar **Create bucket** pe click kar dein. (Par rukiye, abhi bhi photos public nahi hui hain!).

---

###### Step 4: The Magic Bucket Policy (JSON)

<span class="hinglish">Aapne AWS ko bol diya ki public access allowed hai, par aapne abhi tak kisi specific file ko public hone ki permission (Policy) nahi di hai! S3 Default rules me sab kuch private rakhta hai.</span>

1. Apni nayi bani bucket par click karein.
2. Upar **Permissions** tab me jayein.
3. Neeche scroll karke **Bucket policy** section me **Edit** pe click karein.
4. Ye necche diya gaya JSON paste karein. (Dhyan rakhein, `"Resource"` me apni bucket ka exact naam dalein, aur end me `/*` zaroor lagayein jiska matlab hai "bucket ke andar ki saari files"):

```json
{
    "Version": "2012-10-17",
    "Statement": [
        {
            "Sid": "PublicReadGetObject",
            "Effect": "Allow",
            "Principal": "*",
            "Action": "s3:GetObject",
            "Resource": "arn:aws:s3:::my-awesome-startup-images-2026/*"
        }
    ]
}
```
<span class="hinglish">Ye policy kehti hai: "Koi bhi insaan (Principal `*`) mere bucket ki kisi bhi file (Resource `/*`) ko read/download (Action `GetObject`) kar sakta hai (Effect `Allow`)." Save changes kar dein!</span>

---

###### Step 5: CORS Configuration (For Direct Browser Uploads)

<span class="hinglish">Agar aap React (ya Angular/Vue) frontend se seedha AWS me photo bhejenge, toh browser CORS error dega kyunki aapki website `localhost:3000` pe hai, aur S3 `amazonaws.com` pe hai.</span>

1. Usi **Permissions** tab me sabse neeche scroll karein jahan **Cross-origin resource sharing (CORS)** likha hai.
2. **Edit** pe click karein aur ye JSON paste karein:

```json
[
    {
        "AllowedHeaders": [
            "*"
        ],
        "AllowedMethods": [
            "PUT",
            "POST",
            "DELETE",
            "GET"
        ],
        "AllowedOrigins": [
            "*"
        ],
        "ExposeHeaders": []
    }
]
```
<span class="hinglish">Iska matlab hai: "Duniya ki kisi bhi website (`AllowedOrigins: "*"`) ko AWS bucket me file daalne (`PUT`, `POST`) ki permission de do". (Production me `*` ki jagah apni website ka exact domain daalna chahiye jaise `https://myapp.com`). Save changes!</span>

---

###### Step 6: The `.env` Safety Warning

<span class="hinglish">Aakhir me, jo Access Keys aapne Step 1 me li thi, unko Node.js me aise use karein:</span>

```env
### .env file
AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
AWS_REGION=ap-south-1
```

<span class="hinglish">**SABSE BADI WARNING:** Apni `.env` file ko hamesha `.gitignore` me daalein! Agar aapne galti se bhi ye do keys GitHub par public commit kar di, toh hackers GitHub par bots chalate hain jo milliseconds me keys chura lete hain. Wo aapke AWS account me hazaron Crypto-mining servers chalu kar denge, aur 2 din ke andar aapko $10,000 (Lagbhag 8 Lakh Rupaye) ka bill aa jayega! Keys AWS ki sabse khatarnak cheez hain, unhe hamesha safe rakhein!</span>
