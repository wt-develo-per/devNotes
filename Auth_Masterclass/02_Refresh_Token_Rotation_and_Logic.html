### Auth Masterclass 2: Refresh Token Rotation & Logic

In the last file, we learned that a 7-day Refresh Token lives safely inside an HTTPOnly Cookie. 
But what happens when the 15-minute Access Token expires? The frontend must call the `/api/refresh` endpoint to get a new one!

Let's dive into the absolute highest level of backend security: **Refresh Token Rotation**.

---

#### 1. The `/api/refresh` Logic

Here is exactly what your Node.js server must do when the `/api/refresh` route is hit:

1. **Read the Cookie:** Get the refresh token from `req.cookies.refreshToken`.
2. **Verify mathematically:** Use `jwt.verify()` to ensure it hasn't expired (7 days).
3. **Check the Database (Stateful):** You MUST query your Postgres database (`SELECT * FROM tokens WHERE token = x`). If the token is not in the database, it means you previously revoked it. **Reject the request.**
4. **Issue new tokens:** Create a brand new 15-minute Access Token, and a brand new 7-day Refresh Token!

---

#### 2. Refresh Token Rotation (The Ultimate Defense)

Did you notice Step 4 above? We didn't just give them a new Access Token. We also gave them a **BRAND NEW Refresh Token!** This is called Token Rotation.

Why do we do this? 
* <span class="hinglish">Maan lo ek bhayankar (advanced) hacker ne kisi tarah se user ki `HTTPOnly` cookie chura li. Ab hacker ke paas master key (Refresh Token A) hai!</span>
* <span class="hinglish">Jaise hi user apna phone kholta hai, uska app `/api/refresh` bulata hai "Refresh Token A" bhej kar. Server use ek naya "Refresh Token B" de deta hai, aur purane wale (A) ko database se delete kar deta hai. </span>
* <span class="hinglish">Ab thodi der baad, hacker wo chori kiya hua "Refresh Token A" use karke ghusne ki koshish karta hai!</span>

**The Magic Trap:**
The server sees "Refresh Token A". But wait, the server knows that "Token A" was already used and destroyed an hour ago! The server realizes: *"Oh my god, someone is trying to use an old, stolen token! This account has been compromised!"*
The server instantly **deletes ALL tokens** belonging to that user from the database. Both the Hacker AND the Real User are instantly logged out and forced to type their password again. The hacker is completely defeated!

```mermaid

#### 3. Real-World Scenarios (10 Practical Examples)

How do Senior Developers handle the craziest Auth edge cases in production?

##### Example 1: The Race Condition (Double Refresh)
**Problem:** The React app loads 3 API requests at the exact same millisecond (`/profile`, `/settings`, `/cart`). All 3 fail because the Access Token is expired. The Axios interceptor fires `/api/refresh` **three times simultaneously**. Because of Token Rotation, the first request succeeds and destroys the token. The 2nd and 3rd requests fail and log the user out!
**Solution:** The Frontend must use a "Queue" or "Mutex Lock". When the first request triggers a refresh, Axios must PAUSE the 2nd and 3rd requests until the new token arrives, then retry them all together.

##### Example 2: Handling Password Changes
**Problem:** A user suspects they are hacked, so they change their password. But the hacker still has a valid 7-day Refresh Token!
**Solution:** Whenever a password is changed, the backend must instantly delete ALL Refresh Tokens associated with that `user_id` from the database. This instantly logs out every device except the current one.

##### Example 3: Tracking Token Families
**Problem:** How does the server know that Token A and Token B belong to the same sequence (so it can detect hacker theft)?
**Solution:** Include a `family_id` (a random UUID) inside the JWT payload. When you rotate Token A into Token B, keep the same `family_id`. If someone re-uses an old token, you tell the database: "Delete ALL tokens that have this `family_id`!"

##### Example 4: Role Changes (Promoting to Admin)
**Problem:** You change a user's role to "Admin" in the database. But their current Access Token still says "Role: User", so they can't access the Admin panel for another 15 minutes!
**Solution:** The frontend can manually trigger a call to `/api/refresh`. The backend reads the *fresh* role from the database and bakes "Role: Admin" into the brand new 15-minute Access Token!

##### Example 5: Redis vs Postgres for Refresh Tokens
**Problem:** Checking Postgres on every `/api/refresh` call is a bit slow.
**Solution:** Store valid Refresh Tokens in Redis as keys! `SET refresh_token:12345 "valid" EX 604800`. Redis will automatically delete it after 7 days, and checking Redis takes 0.001 seconds!

##### Example 6: Multi-Tab Logout
**Problem:** A user has your website open in 5 tabs. They click "Logout" in Tab 1. Tab 2 doesn't know they logged out, and if they click a button there, it crashes.
**Solution:** Use the browser's `BroadcastChannel` API or listen to the `storage` event. When Tab 1 logs out, it broadcasts a message. Tabs 2, 3, 4, and 5 hear it and instantly redirect to the Login screen!

##### Example 7: Sliding Window Expiration
**Problem:** A user is actively working on your site for 8 straight days. Suddenly, they get logged out because the 7-day Refresh Token died.
**Solution:** Implement a Sliding Window! If a user uses a Refresh Token that has less than 2 days remaining, extend the new Refresh Token's life back up to 7 days. If they don't visit for 7 days, they stay logged out.

##### Example 8: Fingerprinting Devices
**Problem:** A hacker steals the HTTPOnly cookie and tries to use it from Russia. 
**Solution:** When issuing the token, generate a random "Device Fingerprint" and store it in LocalStorage AND hash it inside the Token. If the hacker steals the cookie but doesn't steal the LocalStorage fingerprint, the server will notice the mismatch and block the request!

##### Example 9: The "Ghost" Access Token
**Problem:** A user deletes their account. But their 15-minute Access Token is still valid for another 12 minutes! They can still delete company data!
**Solution:** For ultra-sensitive routes (like `DELETE /company`), do not rely purely on the stateless JWT. Do a quick Postgres check to ensure the user still exists!

##### Example 10: Limiting Active Sessions
**Problem:** A user shares their Netflix password with 50 people.
**Solution:** In the database, count how many active Refresh Tokens exist for that `user_id`. If the count goes above 4, block the login attempt or automatically delete the oldest Refresh Token!
