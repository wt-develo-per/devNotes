### Auth Masterclass 3: Role-Based Access Control (RBAC)

In the previous files, we solved **AuthN (Authentication)**: Proving *Who* you are (using Access and Refresh tokens).
Now we must solve **AuthZ (Authorization)**: Deciding *What* you are allowed to do.

If you don't implement AuthZ correctly, any normal user could accidentally send a request to `DELETE /api/users` and wipe your entire database!

---

#### 1. The RBAC Database Architecture

How do we actually store roles and permissions in Postgres? You need 3 core tables to build a solid RBAC system:

1. **`users` Table:** Stores the user (`id`, `name`, `role_id`).
2. **`roles` Table:** Stores the roles (`id`, `name` like 'ADMIN' or 'USER').
3. **`permissions` Table:** Stores the actions (`id`, `action` like 'delete_user', 'create_post').
4. *(Optional but recommended)* **`role_permissions` Table:** A mapping table that connects Roles to Permissions (e.g., The 'ADMIN' role has the 'delete_user' permission).

* <span class="hinglish">Jab ek choti app banti hai, tab log simply `users` table me ek string column daal dete hain `role = "admin"`. Lekin jab app badi hoti hai (jaise Netflix ya AWS), tab aapko ek proper Permissions table chahiye hoti hai. Taaki aap dynamically decide kar sako ki "Manager" role kya kya kar sakta hai, bina backend code change kiye!</span>

---

#### 2. The Express.js Middleware Defense

To protect an API route, you write a Custom Middleware in Node.js. 

```javascript
// The Authorization Middleware
const authorize = (allowedRoles) => {
    return (req, res, next) => {
        // req.user is set by your previous JWT verification middleware
        const userRole = req.user.role; 

        if (!allowedRoles.includes(userRole)) {
            return res.status(403).json({ error: "Access Denied! Tumhari aukaat nahi hai!" });
        }
        
        // If they have the role, let them through!
        next(); 
    };
};

// Applying the defense to a route
app.delete('/api/users/:id', authorize(['SUPER_ADMIN']), deleteUserFunction);
app.post('/api/products', authorize(['ADMIN', 'SUPER_ADMIN']), createProductFunction);
```

---

#### 3. Real-World Scenarios (10 Practical Examples)

How do Senior Developers handle roles in production?

##### Example 1: Banned Users
**Problem:** A user is spamming the forum. You want to stop them from posting, but you still want them to be able to log in and read posts.
**Solution:** Change their role from `USER` to `BANNED`. In your middleware for `POST /comments`, only allow `['USER', 'ADMIN']`. The banned user gets a 403 Forbidden instantly!

##### Example 2: Hiding UI Elements in React
**Problem:** A normal user clicks the "Delete User" button on the frontend. The backend blocks it with 403 Forbidden, but the user is still confused why the button exists!
**Solution:** Send the user's role in the Access Token. In React, use Conditional Rendering: `&lt;Fragment&gt;{user.role === 'ADMIN' && &lt;button&gt;Delete&lt;/button&gt;}&lt;/Fragment&gt;`. Never show buttons they can't click!

##### Example 3: The "Super Admin" Fallback
**Problem:** You create a new route `GET /api/reports`. You forget to add `SUPER_ADMIN` to the allowed roles array. Now even the CEO is blocked!
**Solution:** Modify your `authorize` middleware so that if `req.user.role === 'SUPER_ADMIN'`, it ALWAYS calls `next()` and ignores the array check entirely. Super Admins bypass everything.

##### Example 4: Caching Permissions in Redis
**Problem:** Querying Postgres to check if a user has the `edit_post` permission on every single API call slows down the server.
**Solution:** When a user logs in, fetch all their permissions from Postgres ONCE, and store them in a Redis Hash. The middleware checks RAM (Redis) instead of Disk (Postgres), taking 0.001 seconds!

##### Example 5: Hierarchy (Managers vs Employees)
**Problem:** An `ADMIN` should be able to create a `MANAGER`, but a `MANAGER` should only be able to create an `EMPLOYEE`.
**Solution:** Assign a "Weight" or "Level" integer to roles in the database (`SUPER_ADMIN: 100`, `ADMIN: 80`, `MANAGER: 50`). In your route, write logic: `if (req.user.level <= targetUser.level) return 403`. You can never modify someone above your level!

##### Example 6: Implicit vs Explicit Permissions
**Problem:** Hardcoding `['ADMIN', 'SUPER_ADMIN']` into 500 different routes is a nightmare to maintain. What if you add a new role called `MODERATOR`? You have to edit 500 files!
**Solution:** Use Explicit Permissions instead of Roles in your middleware! `app.delete('/post', requirePermission('delete_post'))`. Now, if you want Moderators to delete posts, you just add a row to the `role_permissions` database table. Zero code changes!

##### Example 7: The "Guest" Role (Unauthenticated Users)
**Problem:** You have an E-commerce site. Anyone can view products, but only logged-in users can buy.
**Solution:** In your JWT middleware, if there is no token, don't throw an error! Instead, set `req.user = { role: 'GUEST' }`. Now your RBAC system naturally handles public users without breaking!

##### Example 8: Temporary Elevation (Sudo Mode)
**Problem:** An Admin's laptop is stolen while they are logged in. The thief starts deleting databases!
**Solution:** For ultra-sensitive actions (like GitHub's "Delete Repository"), require the Admin to re-enter their password, even if their token is valid. This issues a short 5-minute "Sudo Token" specifically for destructive actions.

##### Example 9: Multi-Role Systems
**Problem:** A user is both an `EDITOR` and a `MODERATOR`.
**Solution:** Change `req.user.role` from a string to an Array of strings: `['EDITOR', 'MODERATOR']`. The middleware checks if *any* of their roles intersect with the allowed roles array using `userRoles.some(r => allowedRoles.includes(r))`.

##### Example 10: "Shadow Banning"
**Problem:** If you ban a toxic user, they will just create a new account and keep spamming.
**Solution:** Give them a hidden role called `SHADOW_BANNED`. Let them post comments successfully on the backend, but filter out their comments so nobody else can see them. The troll thinks they are posting, but they are talking to a wall!
