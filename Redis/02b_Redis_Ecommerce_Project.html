### Redis Masterclass 2b: Amazon/Flipkart Architecture

To truly understand the power of Redis, we must see how an E-Commerce giant like Amazon or Flipkart survives the "Big Billion Days" sale without their servers crashing.

If 1 Crore (10 Million) users open Flipkart at the exact same time, Postgres will instantly die. Here is how Redis saves the company.

---

#### 1. The 10 E-Commerce Redis Scenarios

Here is the exact architecture of a massive E-Commerce web application.

##### Scenario 1: The Homepage (Heavy Caching)
**Problem:** The Homepage loads 50 "Trending Products". Querying the Postgres database to calculate the top 50 products out of 10 million products takes 4 seconds. If 100,000 users open the homepage, the database receives 100,000 heavy queries per second. It will explode.
**Solution:** 
* <span class="hinglish">Flipkart ka backend har ghante (every hour) sirf EK baar Postgres se "Trending Products" calculate karta hai aur usko Redis RAM me JSON String banakar save kar deta hai (`SET homepage_trending "[...data...]"`).</span>
* <span class="hinglish">Ab jo 1 Lakh users homepage kholenge, Node.js seedha Redis se 0.001 seconds me data de dega. Postgres ko pata bhi nahi chalega ki sale chal rahi hai! Pura load RAM utha leta hai.</span>

##### Scenario 2: Flash Sale Inventory (Preventing Overselling)
**Problem:** You have 100 iPhone 15s on sale for $100. 50,000 users click "Buy" at the exact same millisecond. If you check inventory in Postgres (`SELECT stock FROM products`), 5,000 users might read "Stock = 100" at the same time, and Postgres will accidentally sell 5,000 phones even though you only have 100!
**Solution:**
* <span class="hinglish">Stock ki quantity ko Redis me rakho (`SET iphone_stock 100`). Jab bhi koi "Buy" dabaye, Redis ka `DECR iphone_stock` (Decrement) command chalao. Redis single-threaded hota hai, iska matlab wo ek time par ek hi user ko handle karta hai (lekin light-speed me). Koi bhi double-booking ya glitch nahi ho sakta. Jaise hi stock 0 ke neeche jaye, Node.js turant "Out of Stock" error phenk dega!</span>

##### Scenario 3: The Shopping Cart (Temporary Hashes)
**Problem:** Users add items to their cart, but 70% of them never checkout. If you save every cart addition into Postgres, you will fill your database with gigabytes of garbage data from users who abandoned their carts.
**Solution:**
* <span class="hinglish">Shopping cart ka data permanent nahi hota. Ise Redis ke **Hash** me save karo. Jaise `HSET cart:user_123 product_id 2 qty 1`. Isse cart instantly load hogi kyonki data RAM me hai. Agar user 7 din tak khareedari nahi karta, toh Redis use automatically delete kar dega (TTL ki madad se). Jab user actually "Checkout/Pay" karta hai, tabhi hum data ko safely Postgres (Disk) me save karte hain!</span>

##### Scenario 4: "Recently Viewed Items" (Lists)
**Problem:** You want to show users a slider of the last 10 products they looked at.
**Solution:**
* <span class="hinglish">Postgres me ek table banana "Recently Viewed" ke naam se bohot slow aur mehenga padega. Iske bajaye Redis ka **List** (Array) use karo. Jaise hi user koi naya product dekhe, `LPUSH user:123:recent "iphone"` chalao. Aur maximum 10 items rakhne ke liye `LTRIM user:123:recent 0 9` use karo. Yeh data lightning fast load hoga.</span>

##### Scenario 5: Search Auto-Complete (Sorted Sets)
**Problem:** When a user types "Sam", you want to instantly suggest "Samsung S23", "Samsung TV". Querying the database using `LIKE '%Sam%'` is famously slow.
**Solution:**
* <span class="hinglish">Search suggestions ko Redis **Sorted Sets** me rakho. Jaise hi user type karega, Redis RAM se milliseconds me auto-complete suggestions dhundh kar dega! E-commerce me fast search ka matlab zyada sales.</span>

##### Scenario 6: Rate Limiting Payment Gateways
**Problem:** A hacker uses a bot to try 10,000 fake credit cards per second on your checkout page.
**Solution:**
* <span class="hinglish">Payment API par Redis se ek Rate Limiter laga do. `INCR rate_limit:user_ip`. Agar user 1 minute me 5 se zyada payment try karta hai, toh Node.js usko block kar dega. Redis RAM me hone ki wajah se is security check me time waste nahi hota.</span>

##### Scenario 7: Time-Limited Coupons (TTL)
**Problem:** You launch a coupon "DIWALI50" that is only valid for exactly 2 hours.
**Solution:**
* <span class="hinglish">Postgres me coupon create karke ek background Cron Job chalana jo har minute check kare ki 2 ghante huye ya nahi... yeh bohot inefficient hai. Redis me `SET coupon:DIWALI50 "50%_OFF" EX 7200` likho. Theek 2 ghante baad Redis is coupon ko khud uda dega (evaporate kar dega).</span>

##### Scenario 8: Tracking Unique Visitors (Sets)
**Problem:** The seller dashboard needs to show exactly how many *Unique* people visited a product page today.
**Solution:**
* <span class="hinglish">Redis ka **Set** use karo. `SADD product:123:visitors "user_id_99"`. Set ki khasiyat ye hai ki wo duplicates allow nahi karta. Agar same user 100 baar page refresh karega, tab bhi Redis use sirf 1 baar count karega. Aur total count nikalne ke liye bas `SCARD` command chalani padti hai.</span>

##### Scenario 9: Real-Time Order Tracking
**Problem:** When a user orders food on Swiggy/Zomato, they stare at the app watching the delivery boy's GPS coordinates update every 3 seconds.
**Solution:**
* <span class="hinglish">Delivery boy ki live location Postgres me save karna bewakoofi hai. Hard drive itne saare fast updates handle nahi kar sakti. GPS coordinates ko Redis me save kiya jata hai, kyonki RAM har second me hazaron updates bina thake (without sweating) handle kar sakti hai. Jab order deliver ho jaye, tab Redis se delete kardo.</span>

##### Scenario 10: Distributed Locks for Checkout
**Problem:** A user accidentally clicks the "Pay Now" button twice really fast. Your server processes two payments and deducts $200 instead of $100.
**Solution:**
* <span class="hinglish">Jab user pehli baar "Pay Now" dabaye, Redis me ek Lock bana do: `SET user:123:checkout "locked" NX EX 5`. `NX` (Not Exists) ka matlab hai yeh lock tabhi banega agar yeh pehle se na ho. Jab user galti se dusri baar click karega, Redis batayega ki "Bhai pehle se lock laga hua hai", aur Node.js us dusri request ko turant reject kar dega. User ka paisa bach gaya!</span>

---

#### 2. The Golden Rule of Caching

* <span class="hinglish">Hamesha yaad rakhna: Jo data bar bar read hota hai lekin kam update hota hai (jaise Homepage Products, Categories), usko Redis me rakhte hain. Aur jo data bohot zyada critical hai (jaise successful Payments, Final Orders), jiske udne se company ka nuksan ho sakta hai, usko hamesha Postgres (Disk) par save karte hain!</span>
