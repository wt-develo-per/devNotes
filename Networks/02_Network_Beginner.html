### Computer Networks 2: Beginner Level

Now that you know what a Network is, it is time to understand the absolute most famous concepts in networking. If you sit in a Software Engineering interview, they will almost always ask you about **TCP vs. UDP** and **The OSI Model**.

---

#### 1. The OSI Model (Simplified)

The OSI Model is a conceptual 7-layer cake. It explains how a WhatsApp message turns from text on your screen into physical electrical electricity on a wire. 

As a software developer, you do not need to memorize all 7. You only need to know **four** of them:

1. **Layer 7 - Application Layer:** This is where you live. This is HTTP, JSON, and APIs. 
2. **Layer 4 - Transport Layer:** This decides *how* to send the data. Does it need a guarantee (TCP) or should it just be fast (UDP)?
3. **Layer 3 - Network Layer:** The Router layer. This attaches the IP Address (Pincode) to the message.
4. **Layer 2 - Data Link Layer:** The Switch layer. This attaches the MAC Address (Physical Hardware Name) to the message.

* <span class="hinglish">Real-life Example: Aap Amazon se ek T-Shirt mangwaate ho (Layer 7). Amazon decide karta hai ki isko safe courier se bhejna hai (Layer 4). Phir us box pe aapka IP Address/Pincode likhta hai (Layer 3). Phir usko aapke building ke watchman / MAC Address ko de deta hai (Layer 2).</span>

---

#### 2. TCP vs. UDP (The Most Famous Interview Question)

At Layer 4 (The Transport Layer), the internet has two different delivery companies. You have to choose which one you want to use.

##### TCP (Transmission Control Protocol)
**Analogy:** A Phone Call.
When you call your friend, you first say "Hello?". They say "Hello" back. You are now connected. If you say a sentence and they don't hear it, they say "Can you repeat that?" and you repeat it.
* **Guaranteed Delivery:** No data is ever lost. If it drops, it is re-transmitted.
* **Ordered:** Packets arrive in the exact order they were sent.
* **Slow:** Because it has to constantly check "Did you get it?", it is slightly slower.
* **Used in:** Emails, Web Browsing (HTTP), File Downloads. (You do not want a downloaded PDF to randomly be missing page 4!).

##### UDP (User Datagram Protocol)
**Analogy:** Throwing Postcards out of a Train Window.
You just write the message and throw it out the window. You do not check if it reached. You do not care what order it reaches in. 
* **No Guarantees:** Data can be lost.
* **Unordered:** Packet 3 might arrive before Packet 1.
* **Lightning Fast:** Because there is no checking, it is insanely fast.
* **Used in:** Live Video Calls (Zoom), Multiplayer Gaming. 

* <span class="hinglish">Kyun hum Zoom call mein UDP use karte hain? Agar mera face 1 second ke liye freeze ho jaaye (lost packet), toh TCP us purane video frame ko dobara bhejega. Par Zoom pe purana frame dekhne ka kya fayda? Mujhe live video chahiye! Isliye hum UDP use karte hain—jo miss ho gaya so gaya, aage badho!</span>

---

#### 3. DNS (Domain Name System)

Computers only understand numbers (IP Addresses). But humans are very bad at memorizing numbers. 

Nobody wants to type `142.250.190.46` in their browser. We want to type `google.com`.
The **DNS** is the Phonebook of the internet. It translates human names into computer numbers.

##### How DNS Works:
1. You type `google.com` into your browser.
2. Your laptop has no idea what that is. So it asks a **DNS Resolver** (usually a server owned by Jio/Airtel or Google's `8.8.8.8`).
3. The DNS server looks up its massive phonebook: <span class="hinglish">"Acha, google.com ko dhund rahe ho? Uska real IP address `142.250.190.46` hai!"</span>
4. Your browser then directly connects to `142.250.190.46`.

```mermaid
sequenceDiagram
    participant User as 💻 Your Laptop
    participant DNS as 📖 DNS Server (8.8.8.8)
    participant Google as ☁️ Google Server

    User->>DNS: 1. "Bhai, google.com ka IP kya hai?"
    DNS-->>User: 2. "Uska IP 142.250.190.46 hai!"
    Note over User, Google: Now the laptop knows exactly where to go!
    User->>Google: 3. Connect to 142.250.190.46 (Using TCP)
    Google-->>User: 4. Returns Google Homepage HTML
```

> [!TIP]
> **Pro Tip:** Ever wondered why changing your DNS to `8.8.8.8` (Google's public DNS) makes your internet feel faster? It's because Indian ISPs (like BSNL or Jio) sometimes have very slow DNS phonebooks. When you use Google's DNS, the translation from name-to-number happens in 10 milliseconds!
