### Computer Networks 4: Advanced Level (FAANG Scale)

Welcome to the big leagues. In this final file, we are going to look under the hood of the internet to see exactly how connections are established and how data routes across the entire planet.

---

#### 1. The TCP 3-Way Handshake

In File 2, we learned that TCP is a "guaranteed" connection (like a phone call). But how exactly does a laptop establish that connection with a server before sending any HTTP data?

It uses the famous **3-Way Handshake: SYN, SYN-ACK, ACK**.

1. **SYN (Synchronize):** Your laptop sends a tiny packet to Google saying, *"Hi, can I talk to you? My starting sequence number is X."*
2. **SYN-ACK (Synchronize-Acknowledge):** Google's server receives it and replies, *"Yes, I hear you X! I am ready to talk. My starting sequence number is Y."*
3. **ACK (Acknowledge):** Your laptop replies, *"I hear you Y! The connection is now open."*

*Only after these 3 steps are completed can your laptop finally send the HTTP `GET` request!*

```mermaid
sequenceDiagram
    participant Laptop as 💻 Your Laptop
    participant Server as ☁️ Google Server

    Laptop->>Server: 1. SYN (Can we talk?)
    Server-->>Laptop: 2. SYN-ACK (Yes, I hear you!)
    Laptop->>Server: 3. ACK (Perfect, connection established)
    Note over Laptop, Server: The TCP Connection is now OPEN
    Laptop->>Server: 4. HTTP GET / (Finally sending real data)
```

* <span class="hinglish">Jab bhi aap website open karte ho, website load hone se pehle ye 3-way handshake milliseconds ke andar hota hai. Bina iske TCP connection ban hi nahi sakta!</span>

#### 2. ARP (Address Resolution Protocol)

We know that Routers use IP Addresses (Pincodes) to send data across the world. 
But when the data finally reaches your house, your home Router has to hand the data to your specific phone. 
To do that, it needs your phone's MAC Address (Physical Hardware Name). 

**How does the Router know which IP Address belongs to which MAC Address?** It uses ARP!

**The ARP Broadcast:**
1. The Router shouts loudly to the entire house (LAN): *"Hey everyone! Who has the IP address `192.168.1.5`? Tell me your MAC address!"*
2. Every device hears the shout, but only your phone replies: *"That's me! Here is my MAC Address: `00:1B:44:11:3A:B7`."*
3. The Router saves this in its **ARP Table** (cache) so it doesn't have to shout next time.

* <span class="hinglish">ARP bilkul ek teacher ki tarah hai jo class mein chillati hai: "Roll number 5 kahan baitha hai?" Roll number 5 haath uthata hai "Ma'am main yahan hoon!" Phir teacher direct uske paas ja kar book de deti hai.</span>

#### 3. BGP (Border Gateway Protocol)

If you live in Mumbai and you request a video from Netflix's server in New York, the data has to travel through 20 different routers across multiple countries and ocean cables to get there.

**How does a Router in Mumbai know the fastest path to New York?**
It uses **BGP**, the protocol that literally holds the global internet together.

BGP is a massive, automated mapping system. 
Massive ISPs (like Jio, AT&T, Verizon) are called **Autonomous Systems (AS)**. They constantly talk to each other using BGP:
* Jio tells AT&T: *"I know the fastest way to get to India."*
* AT&T tells Jio: *"Great! And I know the fastest way to get to Netflix in New York."*

If a giant ocean cable between Europe and America accidentally gets cut by a shark, BGP instantly updates the global map and re-routes all traffic through Japan instead!

> [!WARNING]
> **The Danger of BGP:** BGP works entirely on "Trust". If a malicious ISP accidentally (or purposefully) broadcasts *"Hey, I am the fastest route to YouTube"*, the entire global internet will start sending YouTube traffic to that ISP, completely taking YouTube offline! This is called a **BGP Hijack**.

---

#### 4. Layer 4 vs. Layer 7 Load Balancing

When you build a massive backend for 10 million users, you put a Load Balancer (like Nginx or AWS ALB) in front of your 50 Node.js servers to distribute the traffic. But there are two ways to do this:

##### Layer 4 Load Balancing (Transport Layer)
The Load Balancer doesn't look at the actual data. It just looks at the TCP/UDP headers (IP and Port) and blindly forwards the traffic to a server.
* **Pros:** Blazing fast. It takes almost 0 CPU power.
* **Cons:** It's "dumb". It cannot make smart decisions.

##### Layer 7 Load Balancing (Application Layer)
The Load Balancer actually opens the package and reads the HTTP data (like the URL path or Cookies).
* **Smart Routing:** It can say: <span class="hinglish">"Acha, is user ne `/video` request kiya hai? Toh main isko directly Video Server ke paas bhejunga. Agar usne `/login` request kiya hota, toh main usko Auth Server ke paas bhejta."</span>
* **Pros:** Extremely smart. Allows for Microservice routing.
* **Cons:** Slower. It takes CPU power to decrypt HTTPS, read the JSON/Headers, and then re-encrypt it before forwarding.

**Congratulations! You have now mastered Computer Networks from zero to FAANG level!**
