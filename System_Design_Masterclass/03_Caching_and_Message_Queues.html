### System Design Masterclass 3: Caching & Message Queues

<span class="hinglish">Database scale karna zaroori hai, par Database (hard-drive) humesha slow hota hai. System Design ka golden rule hai: **"Protect the Database at all costs!"** Isko protect karne ke liye hum 2 astra (weapons) use karte hain: **Redis** (Caching ke liye) aur **Kafka/RabbitMQ** (Message Queues ke liye).</span>

---

#### 1. Caching Strategies (Cache-Aside vs Write-Through)

<span class="hinglish">Redis RAM me chalta hai, isliye wo MySQL/MongoDB se 100x fast hai. Par Database aur Redis ko sync kaise rakhein?</span>

* **Cache-Aside (Lazy Loading):** <span class="hinglish">Node.js pehle Redis me check karta hai. Agar data nahi mila (Cache Miss), toh wo Database se nikalta hai, Redis me save karta hai, aur user ko bhejta hai. (Fayda: Sirf wahi data RAM me jata hai jo actually demand me ho).</span>
* **Write-Through:** <span class="hinglish">Jab bhi user koi naya comment likhta hai, Node.js usko ek hi waqt (simultaneously) Redis me bhi save karta hai aur Database me bhi. (Fayda: Data humesha 100% fresh rehta hai).</span>

```mermaid
graph TD
    User["User requests Data"] --> API["Node.js API"]
    API -->|"1. Check Redis"| Redis[("Redis (RAM)")]
    Redis -.->|"Cache Hit: Fast!"| User
    API -->|"2. Cache Miss: Query DB"| DB[("MySQL (Disk)")]
    DB -->|"3. Save to Redis"| Redis
    DB -.->|"Return Data"| User
```

---

#### 2. Message Queues (Synchronous vs Asynchronous)

<span class="hinglish">Agar user ek PDF generate karne ki request karta hai jisko banne me 10 seconds lagte hain, toh aap user ke browser ko 10 seconds tak "Loading" (Synchronous) nahi dikha sakte. User page close kar dega!
Senior Engineers aisi heavy tasks ko **Asynchronous** bana dete hain ek Message Queue (RabbitMQ ya Kafka) ke zariye. User ko turant "Success" dikha diya jata hai, aur backend aaram se apna kaam background me karta rehta hai.</span>

---

#### 3. Real-World Design Scenarios (The Interviews)

<span class="hinglish">Let's deconstruct 2 massively scalable architectures using Redis and Queues.</span>

##### Scenario 1: Design a Live Gaming Leaderboard (PUBG/Free Fire)
**The Problem:** <span class="hinglish">Maan lo game me 10 Million (1 crore) players hain. Har second unka score badh raha hai. User profile pe click karte hi uski Top Rank (Jaise `Rank #45,992`) instantly (1 millisecond me) dikhani hai. Agar aap MySQL me `SELECT COUNT(*) WHERE score > my_score` chalaoge, toh 10 Million rows scan honge aur database wahin jal jayega!</span>

**The Architecture:**
1. **The Weapon (Redis Sorted Sets):** <span class="hinglish">Leaderboards ke liye hum relational database bilkul use nahi karte! Redis me ek special data structure hota hai jise **Sorted Sets (ZSET)** kehte hain. Ye values ko RAM me hamesha automatically sort karke rakhta hai.</span>
2. **The Flow:** <span class="hinglish">Jaise hi player game jeetta hai, Node.js Redis ko bolta hai `ZINCRBY leaderboard 5 "player123"` (Player 123 ke 5 point badha do). Redis background me RAM ke andar usko O(log(N)) speed me re-sort kar deta hai.</span>
3. **Fetching the Rank:** <span class="hinglish">Jab player apni rank dekhna chahta hai, toh hum query karte hain `ZREVRANK leaderboard "player123"`. Redis 1 millisecond me uski exact rank bata deta hai, chahe data kitna bhi bada kyu na ho!</span>

```mermaid
graph TD
    Game["Player wins match"] --> API["Node.js Score API"]
    API -->|"ZINCRBY (O(log(N)))"| Redis[("Redis Sorted Set")]
    
    Viewer["Player opens Profile"] --> ProfileAPI["Profile API"]
    ProfileAPI -->|"ZREVRANK (O(log(N)))"| Redis
    Redis -->|"Returns exact Rank instantly"| ProfileAPI
    ProfileAPI --> Viewer
```

##### Scenario 2: Design Netflix/YouTube Video Upload Pipeline
**The Problem:** <span class="hinglish">Creator ne 5GB ka 4K video YouTube par upload kiya. Video ko web par dikhane ke liye usko 1080p, 720p, aur 480p me convert (encode) karna padta hai. Is conversion me 30 minutes lag sakte hain. Node.js 30 minute tak HTTP request hold nahi kar sakta (Server timeout ho jayega).</span>

**The Architecture:**
1. **The Upload:** <span class="hinglish">Creator video upload karta hai. Video seedha AWS S3 me save hota hai (via Direct Upload jo humne seekha tha). Jaise hi upload success hota hai, Node.js turant creator ko bolta hai "Video Uploaded Successfully! Processing started." (Creator khush!).</span>
2. **The Message Queue:** <span class="hinglish">Node.js ek message **RabbitMQ ya Kafka** (Queue) me daal deta hai: *"Bhai, S3 me ek naya video aaya hai, isko process karo"*.</span>
3. **The Worker Nodes (Encoding Farm):** <span class="hinglish">Dusri taraf humne 10 heavy CPU wale servers (Workers) laga rakhe hain. Worker 1 queue se message uthata hai aur video ko 1080p me convert karne lagta hai. Worker 2 720p me lag jata hai.</span>
4. **Completion:** <span class="hinglish">Jab Workers apna kaam khatam kar lete hain, wo convert hui videos ko wapas S3 me daalte hain aur Database me status "Ready" mark kar dete hain. Tab jaakar video viewers ko dikhna shuru hoti hai.</span>

```mermaid
graph TD
    Creator["Creator uploads 4K Video"] --> S3[("AWS S3 (Raw Video)")]
    S3 -->|"Trigger Event"| API["Node.js API"]
    API -->|"Send Job: Process Video"| Queue["RabbitMQ/Kafka (Message Queue)"]
    API -.->|"Response: Success, processing..."| Creator
    
    Queue -->|"Pulls Job"| Worker1["Worker Node (1080p Encoder)"]
    Queue -->|"Pulls Job"| Worker2["Worker Node (720p Encoder)"]
    
    Worker1 -->|"Saves encoded video"| S3Encoded[("AWS S3 (Processed Videos)")]
    Worker2 -->|"Saves encoded video"| S3Encoded
    
    Worker1 -->|"Update Status to Ready"| DB[("MySQL Database")]
```

        document.addEventListener('DOMContentLoaded', () => {
            const renderer = new marked.Renderer();
            const originalCode = renderer.code.bind(renderer);

            const content = document.getElementById('markdown-content').textContent;

            mermaid.initialize({ startOnLoad: false, theme: 'default' });

            document.querySelectorAll('code.language-mermaid').forEach((block, index) => {
                const id = `mermaid-${index}`;
                const source = block.textContent;
                
                const div = document.createElement('div');
                div.className = 'mermaid-container';
                div.id = id;
                
                block.replaceWith(div);
                
                mermaid.render(id + '-svg', source).then(result => {
                    div.innerHTML = result.svg;
                }).catch(err => {
                    console.error(err);
                    div.innerHTML = "Mermaid Syntax Error: " + err.message;
                });
            });
        });
