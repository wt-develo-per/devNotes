### System Design Masterclass 4: Microservices vs Monolith

<span class="hinglish">Jab aap apna pehla Node.js/Express project banate ho, toh saara code (Users, Products, Payments, Cart) ek hi bade folder me hota hai. Ise **Monolith** (Ek bada pathar) kehte hain. Startups ke liye Monolith best hota hai!
Par jab company me 500 developers ho jate hain, toh Monolith me ek chhoti si galti poori app ko crash kar sakti hai. Tab hum use chhote-chhote tukdo me todte hain, jise **Microservices** kehte hain!</span>

---

#### 1. The Monolith Problem

<span class="hinglish">Maan lo ek e-commerce app Monolith hai. Payment team ne naya code push kiya, jisme ek infinite loop (`while(true)`) ka bug tha. Is bug ki wajah se Node.js ki CPU 100% full ho gayi.
Nateeja? Payment toh fail hua hi, par sath me Users login bhi nahi kar pa rahe hain, aur log Product bhi nahi dekh pa rahe hain! Ek feature ne puri company ko down kar diya! (Single Point of Failure).</span>

---

#### 2. The Microservices Solution

<span class="hinglish">Is problem ko solve karne ke liye hum 3 alag-alag chhoti Node.js apps banate hain:
1. `User Service` (Apne khud ke chote database ke sath).
2. `Product Service` (Apne database ke sath).
3. `Payment Service` (Apne database ke sath).

Ab agar Payment service crash hoti hai, toh sirf payment page kaam nahi karega, par log aaram se app me login kar sakte hain aur products dekh sakte hain! Company puri tarah band nahi hogi!</span>

```mermaid
graph TD
    subgraph Monolith_Architecture ["Monolith Architecture"]
        Monolith["Giant Express App"] --> DB[("Giant Shared Database")]
    end
    
    subgraph Microservices_Architecture ["Microservices Architecture"]
        User["User Service"] --> U_DB[("User DB")]
        Prod["Product Service"] --> P_DB[("Product DB")]
        Pay["Payment Service"] --> Pay_DB[("Payment DB")]
    end
```

---

#### 3. Real-World Design Scenarios (The Interviews)

<span class="hinglish">Microservices banane me sabse bada challenge hota hai communication aur deployment. Chaliye 2 real-world architectures dekhte hain.</span>

##### Scenario 1: Design Uber Backend
**The Problem:** <span class="hinglish">Uber me ek taraf Riders hain jo cab dhoond rahe hain (HTTP requests), ek taraf Drivers hain jo har 5 second me apni GPS location bhej rahe hain (WebSockets), aur ek taraf Payments hain jo Stripe se connect hote hain. Agar ye sab Monolith hota toh roz crash hota! Uber ko microservices me kaise todein?</span>

**The Architecture:**
1. **The API Gateway:** <span class="hinglish">Jab mobile app request bhejti hai, toh use nahi pata ki `Payment Service` ka IP address kya hai. Sabse aage hum ek **API Gateway** (jaise Kong ya AWS API Gateway) lagate hain. Ye ek receptionist ki tarah kaam karta hai aur requests ko sahi Service ke paas bhejta hai.</span>
2. **Location Service (WebSocket):** <span class="hinglish">Drivers hamesha movement me hote hain. HTTP requests bohot slow hongi. Hum ek alag `Location Service` banate hain jo WebSockets use karti hai taaki real-time bi-directional (dono taraf se) baat ho sake. Ye service data ko hamesha Redis me rakhti hai (kyunki MongoDB GPS ke liye slow hai).</span>
3. **Dispatch/Matching Service:** <span class="hinglish">Ye Uber ka "Brain" hai. Ye service Rider ki request aane par Location service se aas-paas ke drivers mangti hai, aur fir un drivers ko notification bhejti hai.</span>
4. **Service-to-Service Communication:** <span class="hinglish">Ye microservices aapas me baat karne ke liye gRPC (fast binary protocol) ya RabbitMQ (Message Queues) ka use karti hain, HTTP API ka nahi (kyunki HTTP slow hai!).</span>

```mermaid
graph TD
    App["Uber Mobile App"] --> Gateway["API Gateway"]
    
    Gateway -->|"Route: /book"| Dispatch["Dispatch Service"]
    Gateway -->|"Route: /pay"| Payment["Payment Service"]
    
    Driver["Driver App"] -->|"WebSockets GPS"| Location["Location Service"]
    
    Location -.->|"Fast gRPC Call"| Dispatch
    Dispatch -.->|"Async Message Queue"| Payment
    
    Location --> Redis[("Redis (Geospatial)")]
```

##### Scenario 2: Transitioning Monolith to Microservices (Swiggy/Zomato)
**The Problem:** <span class="hinglish">Aapki purani Swiggy jaisi Food Delivery app 5 saal purane bade Monolith par chal rahi hai. App bohot badi ho chuki hai. Naye CEO ne bola: "Isko Microservices me convert karo". Par twist ye hai ki aap app ko 1 second ke liye bhi offline nahi kar sakte (Zero Downtime chahiye!). Ek sath puri app rewrite karna impossible hai.</span>

**The Architecture:**
1. **The Strangler Fig Pattern:** <span class="hinglish">Senior Architects ek famous pattern use karte hain jise `Strangler Pattern` kehte hain (Ek bel jo purane ped pe ugti hai aur dheere dheere use maar deti hai). Hum ek raat me sab rewrite nahi karte!</span>
2. **Step 1:** <span class="hinglish">Hum purane Monolith ke theek aage ek API Gateway khada kar dete hain. Abhi saara traffic purane Monolith me hi jaa raha hai.</span>
3. **Step 2:** <span class="hinglish">Hum sirf ek chhota sa hissa, jaise "User Profile", ko ek nayi Microservice me rewrite karte hain. API Gateway ko bolte hain: "Bhai, ab agar koi `/profile` request aaye, toh usko Nayi Microservice pe bhej dena. Baaki saari `/orders` aur `/menu` ki request purane Monolith pe hi bhejna."</span>
4. **Step 3:** <span class="hinglish">Agle mahine hum "Orders" ko rewrite karke nayi microservice banate hain. Aise karte karte, 6 mahine me purane Monolith me koi traffic nahi bachta, aur hum use finally Delete kar dete hain! Zero downtime!</span>

```mermaid
graph TD
    subgraph Step1_The_Beginning ["Step 1: The Beginning"]
        G1["API Gateway"] -->|"All Traffic"| Mono1["Old Monolith App"]
    end
    
    subgraph Step2_The_Strangler ["Step 2: The Strangler Pattern"]
        G2["API Gateway"] -->|"/profile"| Micro1["NEW User Microservice"]
        G2 -->|"/orders, /menu"| Mono2["Old Monolith App"]
    end
    
    subgraph Step3_The_End ["Step 3: The End"]
        G3["API Gateway"] -->|"/profile"| Micro2["NEW User Microservice"]
        G3 -->|"/orders"| Micro3["NEW Order Microservice"]
        Mono3["Old Monolith (DELETED)"]
    end
```

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const renderer = new marked.Renderer();
            const originalCode = renderer.code.bind(renderer);
            renderer.code = function(code, language, isEscaped) {
                if (language === 'mermaid') {
                    return `<code class="language-mermaid" style="display:none;">${code}</code>`;
                }
                return originalCode(code, language, isEscaped);
            };

            const content = document.getElementById('markdown-content').textContent;
            document.getElementById('content').innerHTML = marked.parse(content, { renderer: renderer });

            mermaid.initialize({ startOnLoad: false, theme: 'default' });

            document.querySelectorAll('code.language-mermaid').forEach((block, index) => {
                const id = `mermaid-${index}`;
                const source = block.textContent;
                
                const div = document.createElement('div');
                div.className = 'mermaid-container';
                div.id = id;
                
                block.replaceWith(div);
                
                mermaid.render(id + '-svg', source).then(result => {
                    div.innerHTML = result.svg;
                }).catch(err => {
                    console.error(err);
                    div.innerHTML = "Mermaid Syntax Error: " + err.message;
                });
            });
        });
    </script>
