### Deployment Masterclass 2: CI/CD & Docker

In File 1, we learned how to SSH into a server, type `git pull`, run `npm install`, and restart PM2.
Doing this manually every single time you fix a typo is exhausting. What if you deploy a bug at 3:00 AM?

We need to automate this process so that **typing `git push` instantly updates the live server.**

---

#### 1. The CI/CD Pipeline (GitHub Actions)

**CI (Continuous Integration):** A robot automatically runs your automated tests when you push code, to ensure you didn't break anything.
**CD (Continuous Deployment):** If the tests pass, the robot automatically logs into your AWS server via SSH, pulls the code, and restarts your app!

```mermaid
graph LR
    Dev[Developer] -->|git push| GitHub[GitHub Repo]
    GitHub -->|Triggers| Actions[GitHub Actions]
    Actions -->|Runs Tests| Tests{Tests Pass?}
    Tests -->|No| Reject[Email Developer 'Failed']
    Tests -->|Yes| SSH[SSH into AWS Server]
    SSH --> Deploy[git pull & pm2 restart]
    
    style Dev fill:#1b5e20,stroke:#2e7d32,color:#fff
    style Actions fill:#000,stroke:#333,color:#fff
    style SSH fill:#f39c12,stroke:#e67e22,color:#fff
```

* <span class="hinglish">Manual deployment matlab roz subah khud jaake dukan ka shutter kholna aur jhaadu lagana. CI/CD ek automated robot hai. Aap bas laptop pe `git push` dabate ho, aur robot udkar dukan kholta hai, naya code set karta hai, aur customer ko serve karna shuru kar deta hai!</span>

---

#### 2. Docker: "It works on my machine!"

The biggest lie in Software Engineering is: *"It works on my machine, so it should work on the server!"*
Your laptop might have Node v20, but the AWS Server has Node v14. Your code crashes!

**Docker solves this.** 
Instead of sending your code to the server, you send a "Docker Image" (A frozen box containing your Code + Node.js v20 + Ubuntu OS). You run that Box on AWS, and it is 100% mathematically guaranteed to behave exactly like it did on your laptop.

---

#### 3. Real-World Scenarios (10 Practical Examples)

How do Senior Engineers automate deployments?

##### Example 1: GitHub Actions Setup
**Problem:** You want GitHub to run a script when you push code.
**Solution:** Create a folder `.github/workflows/deploy.yml`. Write YAML code that tells GitHub: `on: push to main branch`, run `npm run test`, and if it passes, use the `appleboy/ssh-action` plugin to securely connect to your VPS!

##### Example 2: Securing Secrets in CI/CD
**Problem:** The GitHub Action needs your server's SSH Key to log into AWS, but if you paste it in your `.yml` file, the whole world can hack your server!
**Solution:** Use **GitHub Secrets**. Go to Repo Settings -> Secrets. Add `SSH_PRIVATE_KEY`. In your `.yml` file, you write `${{ secrets.SSH_PRIVATE_KEY }}`. GitHub injects it secretly at runtime!

##### Example 3: Zero-Downtime Deployments
**Problem:** When GitHub runs `pm2 restart app`, your server goes offline for 3 seconds while Node boots up. Users see a 502 Bad Gateway error!
**Solution:** Use **PM2 Reload**. `pm2 reload app`. PM2 will start a *second* background copy of your new code. Once the new copy is fully ready, it quietly deletes the old copy. Users never see a single millisecond of downtime!

##### Example 4: Instant Rollbacks
**Problem:** You pushed a massive bug that crashes the app. You need to fix it immediately, but fixing the code will take 20 minutes!
**Solution:** PM2 keeps a history! Just SSH into the server and run `pm2 revert app`. PM2 will instantly switch back to the previous working version of your code!

##### Example 5: Staging vs Production
**Problem:** You want to test a new feature on a live URL before showing it to customers.
**Solution:** Buy `staging.mywebsite.com`. Set up a second GitHub Action that triggers only on the `develop` branch. When you push to `develop`, it deploys to the Staging URL for your QA team. When you push to `main`, it deploys to the Production URL!

##### Example 6: The Dockerfile
**Problem:** You want to freeze your app into a Docker Image.
**Solution:** Write a `Dockerfile`:
```dockerfile
FROM node:20-alpine
WORKDIR /app
COPY package.json .
RUN npm install
COPY . .
CMD ["npm", "start"]
```
This 6-line file instructs Docker exactly how to build the "Frozen Box"!

##### Example 7: Docker Compose (The Magic Command)
**Problem:** Your app needs Node.js, MongoDB, AND Redis. Starting all 3 manually is annoying.
**Solution:** Write a `docker-compose.yml` file listing all 3 services. You type `docker-compose up -d`, and Docker automatically downloads the DB, configures the network, and starts everything together!

##### Example 8: Database Migrations in CI/CD
**Problem:** You added a new column to a Postgres table on your laptop. But when GitHub deploys your code, the live DB doesn't have that column!
**Solution:** Add a step in your GitHub Actions `.yml` file: `npm run migrate:up`. This runs a SQL script that safely adds the column to the live database *before* restarting PM2!

##### Example 9: Notifying Slack/Discord
**Problem:** The team wants to know when a new version goes live.
**Solution:** Add a final step to your GitHub Action that uses `curl` to send a Webhook message to your company's Slack channel: "✅ Version 2.4 deployed to Production successfully!"

##### Example 10: Handling Heavy `npm install`
**Problem:** Every time GitHub Actions deploys, it runs `npm install` on the server, which takes 30 seconds and eats up the server's CPU!
**Solution:** Use a Docker Registry (like Docker Hub or AWS ECR). GitHub Actions builds the image on GitHub's fast computers, pushes the 50MB Image to Docker Hub, and your cheap AWS server just pulls the finished Image! No `npm install` required on the live server!
