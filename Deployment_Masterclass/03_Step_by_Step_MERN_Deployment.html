### Deployment Masterclass 3: Step-by-Step MERN Stack

Deploying a full MERN (MongoDB, Express, React, Node) stack is where most Junior developers get completely stuck. The frontend and backend act completely differently in production than they do on Localhost!

Here is the exact step-by-step Senior workflow to deploy a MERN app on a single Ubuntu VPS.

---

#### Step 1: The Database (MongoDB)
Do **NOT** install MongoDB on your Ubuntu server! Managing database backups and security is incredibly hard.
Instead, create a free cluster on **MongoDB Atlas**. It gives you a Connection URI (`mongodb+srv://...`). 
*Important:* In Atlas, go to "Network Access" and allow IP `0.0.0.0/0` (or specifically whitelist your AWS Server's IP address) so your Node app can connect to it!

#### Step 2: The Backend (Node/Express)
1. SSH into your Ubuntu server.
2. `git clone` your repository.
3. `cd backend` and `npm install`.
4. Create the secret file: `nano .env` and paste your MongoDB Atlas URI and JWT Secrets.
5. Start it permanently: `pm2 start server.js --name "mern-backend"`.
Your API is now running successfully on port `3000` in the background!

#### Step 3: The Frontend (React)
React does **NOT** run on a Node.js server in production! The `npm start` command you use on localhost is just a temporary development server.
1. On your server (or via CI/CD), go to `cd frontend`.
2. Run `npm install`.
3. Run `npm run build`.
This command destroys all your React code and spits out a completely static folder called `build` containing pure HTML, CSS, and heavily minified Javascript.

* <span class="hinglish">Production me React ka koi "Server" nahi hota! `npm run build` karne ke baad React ekdum simple static HTML ban jata hai. Jise koi bhi web server (NGINX) asani se serve kar sakta hai, bina Node.js ke!</span>

#### Step 4: The Ultimate NGINX Config (The Bridge)
Now we configure NGINX to handle BOTH the React Frontend and the Express Backend simultaneously on port 80!

Open `/etc/nginx/sites-available/default` and write this:

```nginx
server {
    listen 80;
    server_name myapp.com;

    # 1. SERVE THE REACT FRONTEND
    # When a user goes to myapp.com, send them the static HTML build!
    location / {
        root /var/www/my-mern-app/frontend/build;
        index index.html index.htm;
        
        # CRITICAL FIX for React Router:
        try_files $uri $uri/ /index.html;
    }

    # 2. SERVE THE EXPRESS BACKEND
    # When the frontend makes an API call to myapp.com/api, route it to Port 3000!
    location /api {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
```

---

#### 10 Real-World Production Gotchas (Why MERN apps break)

##### Gotcha 1: The React Router 404 Bug
**Problem:** You deploy React. You click a link to `/dashboard`, it works! But if you refresh the page at `/dashboard`, NGINX throws a `404 Not Found` error!
**Solution:** NGINX looks for a folder named `dashboard` on the hard drive, which doesn't exist (because React is a Single Page App!). The `try_files $uri $uri/ /index.html;` line tells NGINX: *"If you can't find the folder, just send them back to index.html and let React Router handle the URL!"*

##### Gotcha 2: Hardcoded Localhost URLs
**Problem:** In your React code, you wrote `axios.post('http://localhost:3000/api/login')`. When you deploy, the user's phone tries to make a request to its *own* localhost, and the app breaks!
**Solution:** Always use relative paths in React in production! Write `axios.post('/api/login')`. Because of our NGINX config, the browser will automatically send it to `myapp.com/api/login`, and NGINX will route it to Node!

##### Gotcha 3: React Environment Variables
**Problem:** You put `REACT_APP_API_KEY=secret` in your `.env` file on the server. But when the user loads the app, the variable is missing!
**Solution:** React Environment Variables are injected *during the Build Step*. If you run `npm run build` and THEN create the `.env` file, the variables won't be there! You must create the `.env` file *before* running the build command.

##### Gotcha 4: Secret Leakage in React
**Problem:** You put your Stripe Secret Key in a `REACT_APP_STRIPE_SECRET` variable.
**Solution:** ANY variable starting with `REACT_APP_` is permanently injected into the public Javascript bundle. A hacker can open Chrome DevTools and see your Stripe Secret! NEVER put backend secrets in the Frontend `.env` file!

##### Gotcha 5: CORS Errors in Production
**Problem:** Your frontend is on `www.myapp.com` and backend is on `api.myapp.com`. The browser blocks the request due to CORS.
**Solution:** If you use the NGINX configuration from Step 4 (routing `/api` on the same domain), you completely bypass CORS because both the Frontend and Backend share the exact same domain (`myapp.com`)!

##### Gotcha 6: MongoDB IP Whitelisting
**Problem:** Your backend connects to Atlas fine on your laptop, but throws a `MongoNetworkError` on the AWS Server.
**Solution:** Your AWS Server has a different IP address! You must log into MongoDB Atlas, go to Network Access, and add the AWS Server's static IP to the whitelist.

##### Gotcha 7: The "Out of Memory" Build Crash
**Problem:** You rented a $5/month server with 1GB RAM. When you run `npm run build`, the server freezes and crashes completely!
**Solution:** Webpack (which builds React) is very RAM-heavy. Create a "Swap File" on Ubuntu (using the hard drive as fake RAM), or better yet, build the React app on GitHub Actions (which has 8GB RAM) and only send the finished `build/` folder to your cheap server!

##### Gotcha 8: Forgetting to Restart PM2
**Problem:** You fixed a bug in the Node backend, typed `git pull`, but the live app still has the bug!
**Solution:** Node loads everything into RAM. Changes on the hard drive don't affect running code. You MUST run `pm2 restart mern-backend` after every `git pull`.

##### Gotcha 9: HTTPS Mixed Content Errors
**Problem:** You secured your frontend with HTTPS. But your frontend tries to fetch data from `http://api.myapp.com`. The browser blocks it with a "Mixed Content Error".
**Solution:** If the frontend is HTTPS, the backend APIs MUST also be fetched via HTTPS. 

##### Gotcha 10: Dropped WebSocket Connections
**Problem:** You added Socket.io for live chat. It works locally, but on the live server, it keeps disconnecting.
**Solution:** NGINX blocks WebSocket connections by default! The lines `proxy_set_header Upgrade $http_upgrade;` and `proxy_set_header Connection 'upgrade';` in our config (Step 4) are explicitly required to allow Socket.io to stay connected through the NGINX bridge!
