### Git Masterclass 2: The Daily Workflow

You will use the commands in this file 90% of the time. These are the absolute basics of surviving in a real software engineering job.

---

#### 1. Setting Up (Do this once)

Before you do anything, you must tell Git who you are. Otherwise, when you upload code, your team won't know who wrote it!
```bash
git config --global user.name "John Doe"
git config --global user.email "john@example.com"
```

##### Getting a Project
There are only two ways to start working on a project:
1. **Starting from scratch:** If you create a brand new folder on your computer, type `git init`. This creates a hidden `.git` folder and turns your normal folder into a tracked Git Repository.
2. **Joining a team:** If you join a company, the code already exists on GitHub. You just type `git clone https://github.com/company/project.git`. This downloads the entire history to your laptop.

---

#### 2. The Holy Trinity (Status, Add, Commit)

This is your daily routine. You write some code in VS Code, and now you want to "Save" it to your Git Time Machine.

##### Step 1: `git status`
Always, *always* type `git status` first. 
It tells you exactly which files you have modified, and which files are waiting in the Staging Area.
* <span class="hinglish">Sabse pehle `git status` dalo. Ye tumhe batayega ki tumne kin files mein changes kiye hain jo abhi tak save nahi hue hain.</span>

##### Step 2: `git add`
Remember the 3 Trees from File 1? You need to move your modified files into the "Staging Area" (The Waiting Room).
* `git add index.html` (Moves just one file to the waiting room).
* `git add .` (Moves ALL modified files into the waiting room. Be careful with this!).

##### Step 3: `git commit -m`
Now that your files are in the Staging Area, you take the snapshot to permanently save them.
* `git commit -m "Added the login button"`

> [!TIP]
> **Pro Tip:** Your commit message must be in the **Imperative Mood** (as if you are giving a command). Do not write "I added the login button" or "Adding login button". Write: `"Add login button"`.

---

#### 3. Syncing with the Cloud (GitHub)

So far, all your commits only exist on your physical laptop. If you drop your laptop in the ocean, your code is gone forever!

##### `git push`
This uploads your local commits to the cloud (GitHub).
* `git push origin main` (Pushes your local 'main' branch to the remote 'origin' server).
* <span class="hinglish">`origin` bas ek nickname hai us URL ka jahan aapne code clone kiya tha. Jab aap `git push` karte ho, toh aapka local save point internet pe chala jata hai.</span>

##### `git pull`
What if your coworker pushed a new feature to GitHub while you were sleeping? 
Before you start coding in the morning, you MUST download their changes!
* `git pull origin main` (Downloads the newest code from GitHub and perfectly merges it into your laptop).

---

#### 4. Branching (Working Safely)

Never, ever write experimental code on the `main` branch. 

##### Creating a Branch
* `git branch feature/payment` (Creates a clone of the code called `feature/payment`).

##### Switching Branches
* `git switch feature/payment` (Moves you into that alternate universe).
* *Note:* Older tutorials will tell you to use `git checkout`. Git recently created the `switch` command because `checkout` was too confusing (it did too many different things). Use `git switch`!

##### The Shortcut
You can create a branch AND switch to it in one single command:
* `git switch -c feature/payment`

---

#### 5. The Real-World Workflow (Pull Requests)

When you finish your `feature/payment` branch, how does it get into the `main` branch?

In the real world, you **do not** use the `git merge` command yourself! That is too dangerous. Instead, you use a **Pull Request (PR)**.

1. You type `git push origin feature/payment`. (Uploads your branch to GitHub).
2. You go to GitHub.com and click **"Create Pull Request"**.
3. A Pull Request is a formal request saying: *"Hey Senior Developers, please look at my payment branch. If the code looks good, please allow me to pull it into the main branch."*
4. Your Senior Developer reviews the code, approves it, and clicks the green "Merge" button on the website.

```mermaid
sequenceDiagram
    participant You as 💻 Your Laptop (feature/login)
    participant GitHub as ☁️ GitHub
    participant Senior as 🧑‍💻 Senior Dev

    You->>GitHub: 1. git push origin feature/login
    You->>GitHub: 2. Open a Pull Request (PR)
    Note over GitHub, Senior: The Code Review Process
    Senior->>GitHub: 3. Leaves comments: "Fix line 42"
    You->>GitHub: 4. Pushes fix to branch
    Senior->>GitHub: 5. Clicks "Approve & Merge"
    Note over GitHub: GitHub merges feature/login into main!
```
