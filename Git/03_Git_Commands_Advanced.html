### Git Masterclass 3: Senior Level (Fixing Disasters)

Welcome to the real world. In this file, we learn how to fix things when they go horribly wrong. If you master these commands, you will be the "Git Wizard" on your engineering team.

---

#### 1. Merge Conflicts (Don't Panic!)

A Merge Conflict happens when you and a coworker edit the **exact same line of code** in the same file, and Git doesn't know who is right.

* <span class="hinglish">Maan lo aapne Line 10 pe background color 'Red' kar diya, aur aapke dost ne usi Line 10 pe color 'Blue' kar diya. Jab aap dono code merge karoge, toh Git confuse ho jayega. "Main kiski baat sunu? Red ya Blue?" Isko Merge Conflict kehte hain.</span>

When this happens, Git stops everything and injects ugly text directly into your code file. It looks like this in VS Code:

<div class="conflict-box">
<span class="conflict-header">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD (Current Change - Your Code)</span><br>
<span class="conflict-current">background-color: red;</span><br>
<span class="conflict-header">=======</span><br>
<span class="conflict-incoming">background-color: blue;</span><br>
<span class="conflict-header">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/coworker (Incoming Change - Their Code)</span>
</div>

##### How to Fix It:
1. **Do not panic.** This is normal.
2. Open the file in VS Code. VS Code will highlight this section brightly.
3. You just delete the weird `<<<<<<` and `======` arrows, and keep the line of code you actually want (or combine both!).
4. Once you fix the code manually, type:
   `git add .`
   `git commit -m "Fixed merge conflict"`

---

#### 2. Undoing Mistakes (`git reset` vs `git revert`)

What happens if you make a terrible commit that breaks the website? You need to undo it.

##### `git revert <commit-id>` (The Safe Way)
Revert does **not** delete your bad commit. Instead, it creates a brand *new* commit that applies the exact opposite changes. 
* **Use this if you have already pushed to GitHub.** (Because deleting history on a public server ruins it for your coworkers).

##### `git reset` (The Dangerous Way)
Reset literally rips the commit out of history as if it never existed. There are 3 levels of violence:

1. **`git reset --soft HEAD~1`** 
   Deletes the commit from history, but keeps all your modified code in the Staging Area so you can fix your typo and commit again.
2. **`git reset --mixed HEAD~1`** (Default)
   Deletes the commit, kicks the files completely out of the Staging Area back into your Working Directory.
3. **`git reset --hard HEAD~1`** (Nuclear Option ☢️)
   Deletes the commit AND permanently deletes all the code you wrote. **Use with extreme caution.**

---

#### 3. Merge vs. Rebase (The Ultimate Debate)

When you want to pull the newest code from `main` into your `feature` branch, there are two ways to do it.

##### `git merge main`
This creates a special "Merge Commit" that ties the two branches together. 
* **Pros:** It preserves the exact chronological history of what happened.
* **Cons:** If you have 50 developers, your Git history looks like a messy spiderweb.

##### `git rebase main`
This is black magic. Rebase rips your feature branch out of the ground, fast-forwards time, and re-plants your branch at the very tip of the newest `main` code.
* **Pros:** It keeps your Git history perfectly in a straight line (Linear History).
* **Cons:** If you mess up a Rebase, it is very difficult to fix. Never rebase a public branch that other people are using!

```mermaid
gitGraph
    commit id: "1"
    branch feature
    commit id: "A"
    checkout main
    commit id: "2"
    commit id: "3"
    checkout feature
    commit id: "B"
```
*(Note: If we REBASE, Commits A & B are moved AFTER Commit 3!)*

---

#### 4. The Panic Button: `git stash`

**Scenario:** You are halfway through writing a complex new feature. Your code is broken. Suddenly, your boss runs in: *"There is a critical bug on the live website! Fix it right now!"*

You can't switch to the `main` branch, because your broken code will come with you! You also don't want to `git commit` broken code. What do you do?

* `git stash` -> Takes all your unsaved work and hides it in a secret invisible drawer. Your branch is now perfectly clean!
* Now you can switch to `main`, fix the bug, and commit it.
* Once the boss is happy, switch back to your branch and type:
* `git stash pop` -> Takes your unfinished work out of the drawer and puts it exactly back where you left it!

* <span class="hinglish">`git stash` ek secret drawer hai. Jab koi achanak room mein aaye, toh aap apna aadha-adhura kaam drawer mein daal ke table saaf kar dete ho. Jab wo chale jayein, toh `stash pop` karke wapas kaam shuru kar do!</span>

---

#### 5. Standard Git Flow (Branch Naming)

When working in a real company, you don't just name branches randomly. The industry uses a standard structure:

* **`main` (or `master`):** The Holy Grail. This code is currently live on the production website. It must never break.
* **`develop`:** The staging area. All developers merge their finished features here for testing.
* **`feature/login-button`:** Where you build new things.
* **`bugfix/payment-crash`:** Where you fix non-critical bugs.
* **`hotfix/database-down`:** Absolute emergencies. This branch comes straight off `main`, fixes the fire, and goes right back into `main`.

**Congratulations! You are now a Git Wizard!**
