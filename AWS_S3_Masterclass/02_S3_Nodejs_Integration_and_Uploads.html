### AWS S3 Masterclass 2: Node.js Architecture & Uploads

<span class="hinglish">Jab bhi koi beginner file upload banata hai, wo YouTube tutorial dekh kar `multer` install karta hai. User frontend se photo Node.js API ko bhejta hai, Node.js usko EC2 server me save karta hai. Par ab hume EC2 server ko "Stateless" banana hai! Hum photos aur PDFs S3 me chahte hain!</span>

---

#### 1. The `multer` Memory Trap

<span class="hinglish">Sabse simple raasta kya lagta hai? User photo Node.js ko bheje, aur Node.js (AWS SDK use karke) us photo ko aage S3 ko bhej de. Ise "Pass-through" kehte hain.
Lekin sochiye, agar 10,000 log ek saath 5MB ki image upload karein, toh kya hoga? Aapke Node.js server ko 50,000 MB (50GB) RAM chahiye un photos ko temporarily hold karne ke liye pehle S3 ko bhejte waqt! Aapka server turant Memory Crash ho jayega! Node.js ek middleman nahi banna chahiye.</span>

---

#### 2. The Senior Solution: Direct Browser Uploads

<span class="hinglish">Senior Architects **Node.js ko poori tarah bypass kar dete hain**. 
Jab user ko photo upload karni hoti hai, Node.js sirf ek "VIP Pass" (Pre-signed POST URL) generate karta hai aur user ko wapas de deta hai. Fir user ka React frontend us VIP Pass ka use karke photo seedha (directly) AWS S3 ko bhej deta hai! 
Is tarike se Node.js ki ek byte bhi RAM use nahi hoti, chahe user 5GB ka 4K video hi kyu na upload kare! AWS S3 crash nahi hota, wo unlimited load le sakta hai!</span>

---

#### 3. Real-World Code: Image/PDF Upload using Multer-S3

<span class="hinglish">Halaki "Direct Browser Upload" best hai badi files ke liye, par chhoti Profile Pictures ya PDF Invoices ke liye hum Node.js ke through upload kar sakte hain, bina server ki hard-drive par save kiye!
Iske liye hum `multer-s3` library use karte hain. Ye file ko Node.js ki memory me save kiye bina directly S3 ko stream kar deta hai!</span>

**The Real-World Setup:**
```javascript
const express = require('express');
const multer = require('multer');
const multerS3 = require('multer-s3');
const { S3Client } = require('@aws-sdk/client-s3');

const app = express();

// 1. AWS Credentials (Never hardcode! Use .env)
const s3 = new S3Client({
    region: 'ap-south-1', // Mumbai Region
    credentials: {
        accessKeyId: process.env.AWS_ACCESS_KEY,
        secretAccessKey: process.env.AWS_SECRET_KEY
    }
});

// 2. Configure Multer-S3 Storage
const upload = multer({
    storage: multerS3({
        s3: s3,
        bucket: 'my-company-documents',
        acl: 'public-read', // Ya 'private' agar secure rakhna hai
        metadata: function (req, file, cb) {
            cb(null, { fieldName: file.fieldname });
        },
        key: function (req, file, cb) {
            // Rename file to avoid overwriting (e.g., 163489389_profile.jpg)
            const uniqueName = Date.now().toString() + '_' + file.originalname;
            cb(null, uniqueName);
        }
    })
});

// 3. The API Route
app.post('/api/upload-profile-pic', upload.single('profileImage'), (req, res) => {
    // Multer-S3 magically saves it directly to S3 and gives us the URL!
    console.log("Successfully uploaded to: ", req.file.location);
    
    // Save this URL to MongoDB!
    res.json({
        message: "Upload success!",
        imageUrl: req.file.location 
    });
});
```
<span class="hinglish">Is code ka jaadu ye hai ki file kabhi bhi aapke EC2/Node.js ki hard-drive ko touch nahi karti. Wo RAM me aati hai aur instantly S3 me stream ho jati hai! MongoDB me hum sirf `req.file.location` (S3 ki link) save karte hain.</span>

---

#### 4. Real-World Scenarios (5 Deep Practical Tricks)

<span class="hinglish">Chaliye dekhte hain S3 aur Node.js ko connect karne ke 5 hardcore real-world scenarios.</span>

##### Example 1: The Pre-signed POST URL Workflow
**Problem:** <span class="hinglish">Aap Node.js ko bypass karke direct S3 par image upload karna chahte ho, par S3 bucket Private hai. Bina AWS keys frontend me leak kiye ye kaise hoga?</span>
**Solution:** 
<span class="hinglish">AWS IAM keys sirf backend me safe rehti hain.
1. Frontend Node.js se kehta hai: "Bhaiya, mujhe `my_selfie.jpg` naam ki photo upload karni hai."
2. Node.js backend AWS API call karta hai (kyunki uske paas keys hain) aur kehta hai: "Mujhe ek 5-minute expiry wali Magic Link (Pre-signed POST) do, jisme sirf `my_selfie.jpg` upload ho sake."
3. Node.js wo link frontend ko bhejta hai.
4. Frontend us link pe seedha HTTP PUT request marta hai! Image direct S3 me gayi, aur Node.js relax kar raha hai!</span>

##### Example 2: S3 CORS Errors (The Silent Killer)
**Problem:** <span class="hinglish">Aapne Pre-signed URL frontend ko bhej di. Par jab React axios/fetch se image AWS S3 par bhejta hai, toh Chrome browser usko block kar deta hai aur laal rang me "CORS Error" dikhata hai!</span>
**Solution:** 
<span class="hinglish">Kyunki aapki website `http://localhost:3000` par hai aur request `https://my-bucket.s3.amazonaws.com` par jaa rahi hai, browser security ke liye usko block kar dega. Isko theek karne ke liye, aapko AWS S3 Console me jana padega, "Permissions" tab me jakar "CORS Configuration" JSON likhna padega: "Bhai S3, localhost:3000 se aane wali POST/PUT requests ko allow kar de!". Tab jaakar upload success hoga.</span>

##### Example 3: The Content-Type Bug
**Problem:** <span class="hinglish">Upload successfully ho gaya! Lekin jab user us S3 Image ke URL par click karta hai, toh photo browser me dikhne ke bajaye automatically computer me download ho jati hai! Aisa kyu?</span>
**Solution:** 
<span class="hinglish">S3 bahut dumb (bevakoof) hai. Usko nahi pata ki wo ek photo hai ya PDF. Wo by default uska header `application/octet-stream` set kar deta hai (jiska matlab hai binary garbage). Aapko upload karte waqt explicitly batana padta hai: `ContentType: 'image/jpeg'`. Tab jaakar browser usko render karega, download nahi! (Upar wale `multer-s3` code me ye automatically manage ho jata hai).</span>

##### Example 4: Multipart Uploads (For 5GB Videos)
**Problem:** <span class="hinglish">Aap Netflix jaisi app bana rahe ho. User 5GB ki 4K movie upload kar raha hai. 4.9GB upload hone ke baad user ka WiFi 2 second ke liye disconnect hota hai. Saara upload fail ho jata hai aur shuru se start karna padta hai!</span>
**Solution:** 
<span class="hinglish">AWS SDK **Multipart Uploads** provide karta hai. Iska matlab hai 5GB video ko frontend me 5MB ke 1,000 chhote-chhote chunks (tukdo) me todna. Phir har tukde ko alag se upload karna. Agar internet disconnect ho jaye, toh pura video dobara upload nahi hoga, sirf wahi ek chhota 5MB ka chunk wapas try hoga! S3 baad me un 1,000 tukdo ko jod kar wapas 5GB ka video bana deta hai!</span>

##### Example 5: S3 Event Triggers & AWS Lambda
**Problem:** <span class="hinglish">Aapne Direct Browser Upload se ek user se 15MB ki DSLR photo S3 me upload karwa li. Par jab app me user list dikhani hai, toh wo 15MB ki photo load hone me 10 seconds lagte hain! Hame uska ek 100KB ka chhota "Thumbnail" chahiye! Lekin photo toh direct S3 me gayi thi, Node.js ko pata hi nahi chala, toh hum image resize kahan karein?</span>
**Solution:** 
<span class="hinglish">S3 me **Event Triggers** hote hain! Jaise hi S3 me koi nayi photo aati hai, S3 khud AWS Lambda (Serverless functions) ko ek message bhejta hai. Wo Lambda function instantly jagta hai, image ko download karke 100KB ka thumbnail banata hai, doosri bucket me save karta hai, aur wapas so jata hai. Aapka Node.js server ye heavy lifting karne se poori tarah bach gaya! Ise **Event-Driven Architecture** kehte hain!</span>
