## PILLAR 2: How Networks and Data Transmission Work

### The Physical Reality of Sending Data

```
When your API responds to a user in Tokyo from a server in Mumbai:

Data travels as electrical signals through fiber optic cables
at roughly 2/3 the speed of light.

Mumbai to Tokyo distance: ~6,000 km
Light travel time: ~20ms
Actual network time: ~100-150ms (routing, switches, processing)

This is called LATENCY. It is physics. You cannot make it faster.
You can only minimize how often you pay this cost.

This is why:
  CDNs exist (serve from server NEAR the user)
  Connection pooling matters (pay connection cost once, reuse)
  Batching requests matters (one trip > many trips)
  Caching matters (pay latency cost once, serve from memory)

### TCP — The Protocol That Makes the Internet Reliable

```
Before HTTP data is sent, TCP connection must be established.
This takes time. Understanding this changes how you design systems.

TCP 3-Way Handshake:

Client                          Server
  │                               │
  │──── SYN ──────────────────→  │  "I want to connect"
  │                               │
  │  ←──── SYN-ACK ─────────────  │  "Okay, I acknowledge"
  │                               │
  │──── ACK ──────────────────→  │  "Great, connection established"
  │                               │
  │     [HTTP request can now]    │
  │     [be sent over this]       │
  │     [established connection]  │

Cost: One round trip (~100ms for distant servers)
      BEFORE any data transfer begins.

This is why:
  Connection pooling is critical (establish once, reuse many times)
  Keep-Alive connections matter (don't close after each request)
  HTTP/2 multiplexing matters (many requests over one connection)

// Without connection pooling (bad):
// Every database query: 
//   TCP handshake (100ms) → Auth (50ms) → Query (10ms) → Close
//   Total: 160ms just for overhead

// With connection pooling (good):
// First query: TCP handshake (100ms) → Auth (50ms) → Query (10ms)
// Every subsequent query: Just the query (10ms)
// Connection reused from pool
```

### Ports — Why They Matter for Backend Engineers

```
IP address = which computer
Port = which program on that computer

Well-known ports you must know:
  22    → SSH (secure shell, server management)
  80    → HTTP
  443   → HTTPS
  3000  → Node.js apps (convention, not standard)
  5432  → PostgreSQL
  3306  → MySQL
  6379  → Redis
  5672  → RabbitMQ
  9200  → Elasticsearch
  27017 → MongoDB

Why this matters practically:
  
  Security groups on AWS:
    Only open port 5432 to your app servers, not the internet
    Only open port 443 to the internet
    Port 22 only to your IP address
  
  If you open port 5432 to the internet:
    Database exposed to the entire internet
    Automated scanners will find it within hours
    Brute force attacks begin immediately
  
  Docker networking:
    Container exposes port 3000 internally
    You map it to host port 8080
    -p 8080:3000 → host:container
```

### DNS Resolution — The Phone Book of the Internet

```
You type: api.yourcompany.com
Server receives: 13.235.47.82

What happens in between:

Step 1: Browser checks its own cache
        "Have I looked up api.yourcompany.com recently?"
        If yes → use cached IP, skip everything else

Step 2: OS checks /etc/hosts file
        Local override file (useful for development)
        127.0.0.1 api.localcompany.com (your local mapping)

Step 3: Query goes to Recursive Resolver
        Usually your ISP or 8.8.8.8 (Google DNS) or 1.1.1.1 (Cloudflare)
        This resolver does the work for you

Step 4: Resolver asks Root Nameserver
        "Who handles .com domains?"
        Root server: "Ask Verisign, they handle .com"

Step 5: Resolver asks TLD Nameserver (Verisign for .com)
        "Who handles yourcompany.com?"
        TLD: "Ask their nameserver: ns1.route53.amazonaws.com"

Step 6: Resolver asks Authoritative Nameserver
        "What is the IP for api.yourcompany.com?"
        Authoritative: "13.235.47.82, and cache this for 300 seconds"

Step 7: Resolver returns IP to browser
        Browser now connects to 13.235.47.82

Total time: 20-100ms (then cached, so free for subsequent requests)

Why backend engineers must understand this:

  1. DNS propagation (when you change A records):
     Old IP cached everywhere for TTL duration (up to 48 hours)
     Users may hit old server during propagation
     Solution: Lower TTL to 60s BEFORE planned changes
     
  2. Service discovery in microservices:
     Internal services find each other via DNS
     db.internal → resolves to database IP
     When DB moves, just update DNS record
     Services automatically find new location
     
  3. Load balancing via DNS:
     api.company.com → returns multiple IPs
     Browser picks one → distributes load
     (Less sophisticated than proper load balancer)
     
  4. Debug with these commands:
     dig api.yourcompany.com        → DNS lookup
     dig api.yourcompany.com +trace → Full resolution path
     nslookup api.yourcompany.com   → Simple lookup
     curl -v api.yourcompany.com    → Full connection debug
```
