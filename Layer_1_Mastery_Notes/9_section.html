## PILLAR 3: Integration Patterns

### Pattern 7: API Gateway Pattern

```
The problem:
  10 microservices. Each client (web, mobile, third-party) 
  needs to talk to all 10.
  
  Without Gateway:
    Mobile app: 10 different URLs to call
               10 different auth systems
               10 different rate limiters
               10 different SSL certificates
               Cross-cutting concerns duplicated everywhere
  
  With Gateway:
    Single entry point for all clients
    Auth happens once at gateway
    Rate limiting centralized
    Request routing to correct service
    Response aggregation (call 3 services, return one response)
    SSL termination
    Logging and tracing injection

Common implementations:
  AWS API Gateway, Kong, Nginx with Lua, custom Node.js gateway
```

```typescript
// Custom lightweight API Gateway in Node.js

import Fastify from 'fastify';
import httpProxy from '@fastify/http-proxy';

const gateway = Fastify({ logger: true });

// Cross-cutting concerns applied ONCE for all services:

// 1. Authentication (all services get req.user for free)
gateway.addHook('preHandler', async (request, reply) => {
  const token = request.headers.authorization?.replace('Bearer ', '');
  
  if (!token) {
    if (isPublicRoute(request.url)) return; // Public routes skip auth
    return reply.status(401).send({ error: { code: 'UNAUTHORIZED' } });
  }
  
  try {
    request.user = await verifyJWT(token);
  } catch {
    return reply.status(401).send({ error: { code: 'INVALID_TOKEN' } });
  }
});

// 2. Rate limiting (per user, not per IP — more accurate)
gateway.addHook('preHandler', async (request, reply) => {
  const key = `rate_limit:${request.user?.id ?? request.ip}`;
  const count = await redis.incr(key);
  
  if (count === 1) await redis.expire(key, 60); // 1 minute window
  
  reply.header('X-RateLimit-Limit', '100');
  reply.header('X-RateLimit-Remaining', Math.max(0, 100 - count).toString());
  
  if (count > 100) {
    return reply.status(429).send({ 
      error: { code: 'RATE_LIMIT_EXCEEDED', retryAfter: 60 } 
    });
  }
});

// 3. Request ID injection (enables distributed tracing)
gateway.addHook('preHandler', async (request) => {
  request.headers['x-request-id'] = request.headers['x-request-id'] ?? crypto.randomUUID();
  request.headers['x-user-id'] = request.user?.id ?? '';
});

// 4. Route to services (configuration-driven)
const services = {
  '/api/users':    'http://user-service:3001',
  '/api/orders':   'http://order-service:3002',
  '/api/products': 'http://product-service:3003',
  '/api/payments': 'http://payment-service:3004',
};

for (const [prefix, upstream] of Object.entries(services)) {
  gateway.register(httpProxy, {
    upstream,
    prefix,
    rewritePrefix: prefix
  });
}

// 5. Response aggregation (BFF — Backend For Frontend pattern)
// Mobile app needs user + active orders in one request (saves round trips):
gateway.get('/api/mobile/dashboard', async (request, reply) => {
  const [user, activeOrders, notifications] = await Promise.all([
    fetch(`http://user-service:3001/users/${request.user.id}`).then(r => r.json()),
    fetch(`http://order-service:3002/orders?userId=${request.user.id}&status=active`).then(r => r.json()),
    fetch(`http://notification-service:3005/notifications/${request.user.id}?unread=true`).then(r => r.json()),
  ]);
  
  // One response → three services called → mobile app happy
  return { user, activeOrders, notifications };
});
