## PILLAR 4: How Data Is Stored and Retrieved

### How a Database Actually Reads Your Data

```
Most developers think: "Database has data. I query it. It returns."

Reality:

Your table users has 10 million rows.
Data stored on disk in pages (usually 8KB each).
With ~100 bytes per row: ~80 rows per page.
10 million rows = ~125,000 pages on disk.

When you run:
SELECT * FROM users WHERE email = 'ravi@example.com';

WITHOUT index:
  Database reads ALL 125,000 pages from disk.
  Scans every single row.
  "Sequential Scan" or "Full Table Scan"
  At 100MB/s disk speed: ~1.25GB of data read = ~12 seconds
  
WITH index on email column:
  B-tree index structure on disk.
  3-4 page reads to find the exact location.
  1 page read to get the actual row.
  Total: 4-5 page reads = milliseconds.

This is why indexes exist.
This is why EXPLAIN ANALYZE is the most important command.
This is why "just add an index" is sometimes the right answer.
```

### B-Tree Index — What It Actually Is

```
B-Tree (Balanced Tree) stores your indexed values in sorted order:

                    [50]
                   /    \
              [25]        [75]
             /    \      /    \
          [10]  [35]  [60]  [90]
          / \   / \   / \   / \
        [5][15][30][40][55][65][80][95]

Each node contains: index value + pointer to actual row on disk.

When you search for email = 'ravi@example.com':
  1. Start at root
  2. Is 'ravi' < or > root value? Go left or right.
  3. Repeat until leaf node
  4. Found: follow pointer to actual row

Result: O(log n) search time
  10 million rows = ~23 comparisons maximum
  Instead of 10,000,000 comparisons without index

Composite index column order MATTERS:
  
  Index on (user_id, status, created_at)
  
  The leftmost prefix rule:
  ┌────────────────────────────────────────────────────┐
  │ Query                              Uses Index?      │
  ├────────────────────────────────────────────────────┤
  │ WHERE user_id = 1                  ✓ YES            │
  │ WHERE user_id = 1 AND status = 'a' ✓ YES            │
  │ WHERE user_id = 1 AND status = 'a' ✓ YES            │
  │       AND created_at > '2024-01-01'                 │
  │ WHERE status = 'active'            ✗ NO             │
  │ WHERE created_at > '2024-01-01'    ✗ NO             │
  └────────────────────────────────────────────────────┘
  
  First column (user_id) MUST be in the query.
  Then subsequent columns can be used in order.
```

### WAL — Why Databases Don't Lose Data on Crash

```
WAL = Write-Ahead Log

The problem without WAL:
  You write a transaction.
  Data is in memory (buffer pool), waiting to be written to disk.
  Power goes out.
  Data is lost. Database is corrupted.

WAL solution:
  BEFORE changing actual data pages:
    Write the INTENT to a log file (WAL)
    WAL write is sequential → very fast (disk sequential write >> random write)
  
  Then: Change data pages in memory (buffer pool)
  Later: Actually write changed pages to disk (checkpoint)
  
  On crash and restart:
    Database reads WAL
    Replays all committed transactions
    Rolls back incomplete transactions
    Database is consistent again

Why you need to know this:
  1. PostgreSQL replication works by streaming WAL to replica
  2. Logical replication reads WAL to stream changes to other systems
  3. Tools like Debezium read WAL for change data capture
  4. "WAL level" setting affects replication capability
  5. WAL accumulates if not consumed → disk fills up
  
  Real incident: Replication slot not consumed for 3 days.
                 WAL accumulated. Disk filled. Database crashed.
                 Primary database down = full outage.
```
