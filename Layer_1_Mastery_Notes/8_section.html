## PILLAR 2: Data Patterns

### Pattern 5: Outbox Pattern — The Bridge Between Databases and Events

```
The problem it solves (critical for production correctness):

  // This has a bug that costs money in production:
  async function createOrder(data) {
    await db.orders.create(data);                    // Step 1: Saves to DB
    await eventBus.publish('order.created', data);   // Step 2: Publishes event
    
    // What if Step 1 succeeds but Step 2 fails?
    // Order exists in database.
    // Event never published.
    // Email never sent.
    // Fulfillment never triggered.
    // Customer paid but order never processed.
    
    // What if Step 2 succeeds but the process crashes before Step 1?
    // Event published.
    // But order never saved.
    // Fulfillment triggered for non-existent order.
  }

The Outbox Pattern solution:
  Write to database AND outbox table in one atomic transaction.
  Separate process reads outbox, publishes events, marks as published.
  Guaranteed: If order is saved, event will eventually be published.
  Guaranteed: If order is not saved, no event will be published.
```

```typescript
// Outbox Pattern implementation

// 1. Database schema:
/*
CREATE TABLE outbox_events (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  event_type VARCHAR(100) NOT NULL,
  payload JSONB NOT NULL,
  created_at TIMESTAMP DEFAULT NOW(),
  published_at TIMESTAMP,         -- NULL = not yet published
  publish_attempts INTEGER DEFAULT 0,
  last_error TEXT
);
*/

// 2. Write order + outbox event in single transaction
class OrderService {
  async createOrder(input: CreateOrderInput): Promise<Order> {
    const client = await this.db.connect();
    
    try {
      await client.query('BEGIN');

      // Create the order
      const orderResult = await client.query(
        `INSERT INTO orders (user_id, total_amount, status, created_at)
         VALUES ($1, $2, 'pending', NOW())
         RETURNING id, user_id, total_amount, status, created_at`,
        [input.userId, input.totalAmount]
      );
      const order = orderResult.rows[0];

      // Write event to outbox IN SAME TRANSACTION
      // If anything fails: BOTH are rolled back. Consistent state guaranteed.
      await client.query(
        `INSERT INTO outbox_events (event_type, payload)
         VALUES ($1, $2)`,
        [
          'order.created',
          JSON.stringify({
            orderId: order.id,
            userId: order.user_id,
            totalAmount: order.total_amount,
            createdAt: order.created_at
          })
        ]
      );

      await client.query('COMMIT');
      return order;

    } catch (error) {
      await client.query('ROLLBACK');
      throw error;
    } finally {
      client.release();
    }
  }
}

// 3. Outbox publisher (separate process, runs continuously)
class OutboxPublisher {
  private isRunning = false;

  async start(): Promise<void> {
    this.isRunning = true;
    while (this.isRunning) {
      await this.processOutbox();
      await this.sleep(1000); // Poll every second
    }
  }

  private async processOutbox(): Promise<void> {
    // Use FOR UPDATE SKIP LOCKED for concurrent-safe processing
    // Multiple publisher instances can run without duplicate processing
    const result = await this.db.query(
      `SELECT id, event_type, payload
       FROM outbox_events
       WHERE published_at IS NULL
         AND publish_attempts < 5
       ORDER BY created_at ASC
       LIMIT 10
       FOR UPDATE SKIP LOCKED`
    );

    for (const event of result.rows) {
      try {
        await this.eventBus.publish(event.event_type, event.payload);
        
        await this.db.query(
          `UPDATE outbox_events 
           SET published_at = NOW(), publish_attempts = publish_attempts + 1
           WHERE id = $1`,
          [event.id]
        );

      } catch (error) {
        // Track failure but don't crash — will retry next poll
        await this.db.query(
          `UPDATE outbox_events 
           SET publish_attempts = publish_attempts + 1,
               last_error = $2
           WHERE id = $1`,
          [event.id, error.message]
        );
        
        logger.error('outbox_publish_failed', {
          eventId: event.id,
          eventType: event.event_type,
          error: error.message
        });
      }
    }
  }
}

/*
Result:
  Order saved + event published: Normal happy path
  Order saved + event publish fails: Retried automatically by publisher
  Order save fails: Outbox entry also rolled back. No orphan events.
  Publisher crashes mid-publish: Unpublished events retried on restart.
  
  This pattern is used in production systems handling millions of dollars.
  Most tutorials never mention it. This is a senior engineer pattern.
*/
```

### Pattern 6: Saga Pattern — Distributed Transactions Without Two-Phase Commit

```
The problem:
  Order service, Payment service, Inventory service are separate.
  User places an order. Three things must happen:
    1. Reserve inventory (Inventory Service)
    2. Charge payment (Payment Service)
    3. Create order record (Order Service)
  
  Any one can fail. You cannot use a single database transaction
  across three separate services/databases.
  
  Without Saga: Partial state. Payment charged. Inventory not reserved.
                Order not created. Customer's money taken, gets nothing.

Saga coordinates through events or direct calls with compensating transactions.
If any step fails: Compensation transactions undo previous steps.

Two types:
  Choreography Saga: Services react to events, coordinate themselves.
  Orchestration Saga:  Central coordinator tells each service what to do.
```

```typescript
// Orchestration Saga (clearer, better for complex flows)

// The Saga orchestrator coordinates the entire flow
class CreateOrderSaga {
  private state: SagaState = { step: 'STARTED', compensations: [] };

  async execute(command: CreateOrderCommand): Promise<Order> {
    let inventoryReservationId: string | null = null;
    let paymentTransactionId: string | null = null;
    let orderId: string | null = null;

    try {
      // Step 1: Reserve inventory
      this.state.step = 'RESERVING_INVENTORY';
      const reservation = await this.inventoryService.reserve({
        productId: command.productId,
        quantity: command.quantity
      });
      inventoryReservationId = reservation.id;
      
      // Register compensation (will be called if later steps fail)
      this.state.compensations.push(async () => {
        await this.inventoryService.cancelReservation(inventoryReservationId);
        logger.info('compensation_executed', { action: 'cancel_inventory_reservation', id: inventoryReservationId });
      });

      // Step 2: Process payment
      this.state.step = 'PROCESSING_PAYMENT';
      const payment = await this.paymentService.charge({
        userId: command.userId,
        amount: command.totalAmount,
        idempotencyKey: `order_${command.requestId}`
      });
      paymentTransactionId = payment.transactionId;
      
      // Register compensation
      this.state.compensations.push(async () => {
        await this.paymentService.refund(paymentTransactionId);
        logger.info('compensation_executed', { action: 'refund_payment', id: paymentTransactionId });
      });

      // Step 3: Create order record
      this.state.step = 'CREATING_ORDER';
      const order = await this.orderRepository.create({
        userId: command.userId,
        productId: command.productId,
        quantity: command.quantity,
        totalAmount: command.totalAmount,
        inventoryReservationId,
        paymentTransactionId,
        status: 'confirmed'
      });
      orderId = order.id;

      // Step 4: Confirm inventory reservation
      await this.inventoryService.confirmReservation(inventoryReservationId);

      this.state.step = 'COMPLETED';
      
      logger.info('order_saga_completed', {
        orderId,
        paymentTransactionId,
        inventoryReservationId
      });
      
      return order;

    } catch (error) {
      // Execute compensating transactions IN REVERSE ORDER
      logger.error('order_saga_failed', {
        step: this.state.step,
        error: error.message,
        compensationsToRun: this.state.compensations.length
      });

      await this.runCompensations();
      throw new OrderCreationError(
        `Order creation failed at step ${this.state.step}: ${error.message}`
      );
    }
  }

  private async runCompensations(): Promise<void> {
    // Run compensations in reverse order
    const compensations = [...this.state.compensations].reverse();
    
    for (const compensate of compensations) {
      try {
        await compensate();
      } catch (compensationError) {
        // Compensation itself failed — needs human intervention
        // This is the rare but real problem with Sagas
        logger.error('compensation_failed', {
          error: compensationError.message
        });
        
        await this.alertingService.sendCritical({
          message: 'Saga compensation failed — manual intervention required',
          sagaState: this.state
        });
        
        // Still continue running remaining compensations
      }
    }
  }
}
