#### Low-Level Design (LLD) Masterclass 3: Creational Design Patterns

<span class="hinglish">Jab aap coding karte ho, toh kai baar aisi problems aati hain jo aapse pehle lakho engineers face kar chuke hain. Jaise "Database ka connection baar-baar ban raha hai aur MySQL crash ho raha hai!"
In problems ke liye 1994 me 4 smart engineers (Jinko **"Gang of Four"** kehte hain) ne ek kitaab likhi aur in common problems ke ready-made solutions diye. Inhe hum **Design Patterns** kehte hain!

Design Patterns 3 types ke hote hain:
1. **Creational:** Objects ko banane (Create) ka sahi tarika.
2. **Structural:** Classes ko aapas me connect karne ka tarika.
3. **Behavioral:** Classes ka aapas me baat karne ka tarika.

Is file me hum **Creational Patterns** dekhenge: The Singleton and The Factory!</span>

---

#### 1. The Singleton Pattern (Only One Exists!)

<span class="hinglish">**Concept:** Kya ho agar aap chahte ho ki kisi Class ka sirf aur sirf **EK HI OBJECT** bane poori application me? Chahe koi 100 baar `new Database()` likhe, usko wahi purana ek object return milna chahiye naya banne ke bajaye.</span>

##### <span class="danger">❌ The Bad Way (MySQL "Too Many Connections" Crash)</span>
<span class="hinglish">Maan lo aapke paas 5 alag-alag Controller files hain (Users, Products, Cart, Orders, Payment). Agar har file me aapne likha `const db = new DatabaseConnection()`, toh Node.js MySQL server ke sath 5 alag connection pool khol lega! Jab 1000 users ek sath aayenge, toh 5000 connections khul jayenge aur MySQL turant crash dega: "Error: Too many connections".</span>

```typescript
// db.ts
export class DatabaseConnection {
    constructor() {
        console.log("Opening massive connection pool to MySQL...");
    }
    public query(sql: string) { /* run query */ }
}

// userController.ts
const db1 = new DatabaseConnection(); // ❌ Creates a NEW expensive connection
db1.query("SELECT * FROM users");

// productController.ts
const db2 = new DatabaseConnection(); // ❌ Creates ANOTHER expensive connection!
db2.query("SELECT * FROM products");
```

##### <span class="success">✅ The Clean Way (The Singleton Pattern)</span>
<span class="hinglish">Hum is class ko ek **Singleton** bana denge. Hum class ke `constructor` ko Private kar denge taaki koi bahar se `new` keyword use hi na kar sake!</span>

```typescript
// db.ts
export class DatabaseSingleton {
    // 1. Ek STATIC variable jo apne andar us single object ko save rakhega
    private static instance: DatabaseSingleton;

    // 2. Constructor ko PRIVATE kar diya! Ab bahar se `new DatabaseSingleton()` likhna ERROR dega!
    private constructor() {
        console.log("Opening ONE connection pool to MySQL...");
    }

    // 3. Ek PUBLIC STATIC function jo object return karega
    public static getInstance(): DatabaseSingleton {
        // Agar object pehle se nahi bana hai, toh naya banao
        if (!DatabaseSingleton.instance) {
            DatabaseSingleton.instance = new DatabaseSingleton();
        }
        // Agar pehle se bana hua hai, toh wahi purana object wapas bhej do!
        return DatabaseSingleton.instance;
    }

    public query(sql: string) { console.log(`Executing: ${sql}`); }
}

// ============================================
// HOW TO USE THE SINGLETON IN YOUR APP
// ============================================

// userController.ts
// const db = new DatabaseSingleton();  ❌ ERROR: Constructor is private!
const db1 = DatabaseSingleton.getInstance(); // ✅ Output: "Opening ONE connection pool..."
db1.query("SELECT * FROM users");

// productController.ts
const db2 = DatabaseSingleton.getInstance(); // ✅ Does NOT print anything! It uses the same object.
db2.query("SELECT * FROM products");

// Verify that both variables are literally pointing to the EXACT same memory object
console.log(db1 === db2); // true!
```
<span class="hinglish">**Real-World Use Cases:** Database Connections, Redis Client, Logger class, ya Configuration (ENV) loader jahan file baar-baar read nahi karni.</span>

#### 2. The Factory Method Pattern (The Object Factory)

<span class="hinglish">**Concept:** Kabhi-kabhi object banan thoda complex hota hai aur hum usme `if-else` ka pahaad laga dete hain (Jaise agar type "Email" hai toh EmailNotification banao, "SMS" hai toh SMSNotification banao). Factory Pattern kehta hai: "Object banane ki headache Controller se lelo, aur usko ek Factory (Karkhana) me daal do."</span>

##### <span class="danger">❌ The Bad Way (Business Logic mixed with Object Creation)</span>
<span class="hinglish">Maan lo ek User Profile controller hai jahan user apni notification preference save karta hai. Wahan notification object create karne ke liye lamba `if-else` hai.</span>

```typescript
// Types (from Polymorphism chapter)
interface INotification { send(msg: string): void; }
class EmailNotif implements INotification { send(m: string) { console.log("Email:", m); } }
class SMSNotif implements INotification { send(m: string) { console.log("SMS:", m); } }
class PushNotif implements INotification { send(m: string) { console.log("Push:", m); } }

// userController.ts
class UserController {
    public alertUser(userType: string, message: string) {
        let notifier: INotification;

        // ❌ BAD: Controller object create karne ki complexity handle kar raha hai!
        // Kal ko agar "WhatsApp" add hua, toh mujhe Controller aakar modify karna padega (OCP Violation!).
        if (userType === 'email') {
            notifier = new EmailNotif();
        } else if (userType === 'sms') {
            notifier = new SMSNotif();
        } else if (userType === 'push') {
            notifier = new PushNotif();
        } else {
            throw new Error("Unknown type");
        }

        notifier.send(message);
    }
}
```

##### <span class="success">✅ The Clean Way (The Factory Pattern)</span>
<span class="hinglish">Hum object banane ke liye ek "Factory" Class banayenge. Uska sirf ek hi kaam hoga (SRP): Request lo, aur sahi Object bana kar return kardo!</span>

```typescript
// 1. The Factory Class (The Karkhana)
class NotificationFactory {
    // Is static function ko bas ek string do, ye tumhe object de dega!
    public static createNotifier(type: string): INotification {
        switch (type.toLowerCase()) {
            case 'email':
                return new EmailNotif();
            case 'sms':
                return new SMSNotif();
            case 'push':
                return new PushNotif();
            default:
                throw new Error(`Notification type ${type} not supported!`);
        }
    }
}

// 2. The Clean Controller
class UserController {
    public alertUser(userType: string, message: string) {
        // ✅ CLEAN: The controller doesn't use 'new' keyword anywhere. 
        // It asks the Factory for the object!
        const notifier = NotificationFactory.createNotifier(userType);
        
        notifier.send(message);
    }
}

// Testing it
const controller = new UserController();
controller.alertUser('sms', 'Your OTP is 9999'); // Output: SMS: Your OTP is 9999
controller.alertUser('push', 'New Friend Request!'); // Output: Push: New Friend Request!
```

<span class="hinglish">**Fayda:** Kal ko agar CEO ne bola "WhatsApp notification add karo", toh main `NotificationFactory` file me ja kar add karunga. Mera `UserController` untouched rahega! Business logic (Controller) aur Object Creation logic (Factory) dono alag ho gaye hain! Ise "Separation of Concerns" kehte hain.</span>
