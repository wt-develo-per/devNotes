#### Low-Level Design (LLD) Masterclass 4: Behavioral Design Patterns

<span class="hinglish">Pichle module me humne dekha ki Object kaise "Create" karte hain (Singleton, Factory). Ab hum dekhenge ki alag-alag Classes aapas me **baat kaise karti hain (Behavior)** bina ek dusre ke sath tightly couple hue!
Is module me hum do sabse zyada pooche jane wale patterns cover karenge: **The Observer Pattern** aur **The Strategy Pattern**. Ye dono patterns aapke Node.js code ko literally 10x zyada scalable bana denge.</span>

---

#### 1. The Observer Pattern (The Event System)

<span class="hinglish">**Concept:** Maan lo aapki ek class hai jisme kuch action hua (e.g., User Signup). Ab uspe 3 dusri classes ko react karna hai (Email bhejna hai, Analytics track karna hai, aur Bonus Points dene hain). Agar aap in teeno ka code Signup function me likhoge, toh function bohot lamba ho jayega (SRP toot jayega). Observer pattern kehta hai: "Signup function sirf chillayega (Emit event) ki user signup ho gaya. Jisko jo karna hai wo sun lega (Listen) aur khud kar lega!" (YouTube Subscriptions ki tarah).</span>

##### <span class="danger">❌ The Bad Way (Tightly Coupled Actions)</span>
<span class="hinglish">Agar main sab kuch ek hi service me likh du, toh code bohot lamba aur tightly coupled ho jata hai. Kal ko agar "SMS Service" add karni padi, toh mujhe is file me aakar ek aur line add karni padegi (OCP Violation!).</span>

```typescript
class UserService {
    constructor(
        private emailService: EmailService,
        private analyticsService: AnalyticsService,
        private bonusService: BonusService
    ) {}

    public async registerUser(user: any) {
        await db.save(user);

        // ❌ DANGER: UserService is directly controlling other services!
        // It has too many responsibilities now.
        this.emailService.sendWelcome(user.email);
        this.analyticsService.trackSignup(user.id);
        this.bonusService.addPoints(user.id, 50);

        return "Success";
    }
}
```

##### <span class="success">✅ The Clean Way (The Observer / Event Emitter)</span>
<span class="hinglish">Node.js me ye pattern by-default `EventEmitter` ke through aata hai. Hum `UserService` ko aisi chiz bana denge jisko kisi aur service ka pata hi nahi hai! Wo bas apna kaam (DB save) karegi, aur ek Event fire kar degi!</span>

```typescript
import { EventEmitter } from 'events';

// 1. Ek Global Event Bus banate hain (Central Hub)
const AppEventBus = new EventEmitter();

// 2. The Clean UserService
class UserService {
    public async registerUser(user: any) {
        await db.save(user); // Apna main kaam kiya

        // ✅ CLEAN: Sirf event fire (emit) kar diya. 
        // Ab koi isko sune (listen kare) ya na kare, UserService ko fark nahi padta!
        AppEventBus.emit('UserRegistered', user); 

        return "Success";
    }
}

// 3. The Observers (Listeners) - Inko alag-alag files me rakha ja sakta hai!
class EmailListener {
    constructor() {
        // Ye chupchap baithe event ka wait karta hai
        AppEventBus.on('UserRegistered', (user) => {
            console.log(`Sending Welcome Email to ${user.email}...`);
        });
    }
}

class AnalyticsListener {
    constructor() {
        AppEventBus.on('UserRegistered', (user) => {
            console.log(`Tracking signup analytics for ID: ${user.id}...`);
        });
    }
}

// Kal ko naya SMS feature add karna hai? Nayi file banao, listener lagao! 
// UserService ko touch bhi nahi karna padega! (OCP achived!)
new EmailListener();
new AnalyticsListener();

const service = new UserService();
service.registerUser({ id: 1, email: "rahul@gmail.com" });
// Output: 
// Sending Welcome Email to rahul@gmail.com...
// Tracking signup analytics for ID: 1...
```

#### 2. The Strategy Pattern (Swapping Logic Dynamically)

<span class="hinglish">**Concept:** E-Commerce me Cart total calculate karte waqt hazaro tarah ke discount lag sakte hain (Flat $10 off, 20% off, Buy 1 Get 1 Free). Agar aapne in sabko `if-else` block me daal diya, toh ek din code itna ulajh jayega ki maintain karna impossible hoga.
Strategy Pattern kehta hai: "Algorithm (Discount logic) ko us function se alag kar do. Ek class banao jo kisi bhi Algorithm class (Strategy) ko input me le, aur calculate kar de." (Ye wahi technique hai jo humne SOLID ke OCP me use ki thi!).</span>

##### <span class="danger">❌ The Bad Way (The `if-else` Nightmare)</span>
<span class="hinglish">Jab bhi naya Coupon aayega, yahan `if-else` lamba hota jayega.</span>

```typescript
class CheckoutService {
    public calculateTotal(price: number, couponCode: string): number {
        // ❌ Tightly coupled algorithms
        if (couponCode === 'FLAT10') {
            return price - 10;
        } else if (couponCode === 'BOGO') {
            return price / 2; // Roughly Buy 1 get 1
        } else if (couponCode === 'WINTER20') {
            return price - (price * 0.20);
        } else {
            return price;
        }
    }
}
```

##### <span class="success">✅ The Clean Way (The Strategy Pattern)</span>
<span class="hinglish">Hum "Context" (Checkout) ko Algorithms (Strategies) se decouple kar denge. Context bas strategy object receive karega aur execute kar dega.</span>

```typescript
// 1. The Strategy Interface
interface IDiscountStrategy {
    calculate(price: number): number;
}

// 2. Concrete Strategies (Alag-alag algorithms)
class Flat10Strategy implements IDiscountStrategy {
    calculate(price: number): number { return price - 10; }
}
class BOGOStrategy implements IDiscountStrategy {
    calculate(price: number): number { return price / 2; }
}
class Winter20Strategy implements IDiscountStrategy {
    calculate(price: number): number { return price - (price * 0.20); }
}
class NoDiscountStrategy implements IDiscountStrategy {
    calculate(price: number): number { return price; }
}

// 3. The Context (Checkout Service)
class CheckoutService {
    private strategy: IDiscountStrategy;

    // Default strategy (No discount)
    constructor() {
        this.strategy = new NoDiscountStrategy();
    }

    // Is function se hum runtime (execution) ke beech me algorithm SWAP kar sakte hain!
    public setDiscountStrategy(strategy: IDiscountStrategy) {
        this.strategy = strategy;
    }

    public executeCheckout(price: number): number {
        // Checkout ko pata hi nahi hai kaunsa algorithm chal raha hai!
        return this.strategy.calculate(price);
    }
}

// ============================================
// HOW TO USE IT (Dynamically swapping behavior)
// ============================================
const checkout = new CheckoutService();

// User normally checkouts
console.log(checkout.executeCheckout(100)); // Output: 100

// User applies WINTER20 coupon
checkout.setDiscountStrategy(new Winter20Strategy());
console.log(checkout.executeCheckout(100)); // Output: 80

// User applies FLAT10 coupon instead
checkout.setDiscountStrategy(new Flat10Strategy());
console.log(checkout.executeCheckout(100)); // Output: 90
```
<span class="hinglish">**Fayda:** Strategy Pattern ka sabse bada fayda ye hai ki Algorithms (BOGO, FLAT10) independent ho gaye hain. Ab aap unhe akele (isolated) Unit Test kar sakte ho. Aur naya algorithm dalne ke liye purana code chherna nahi padega!</span>
