### Backend Foundation 3a: Authentication & Authorization

You are absolutely right: to cover this correctly requires dedicating a whole file just to Identity. 

Because HTTP is inherently **stateless** (it forgets who you are the second after a request finishes), engineers have spent decades inventing complex flows to allow users to securely "log in" and stay logged in. 

---

#### 1. The Core Concepts

Before looking at architecture, we must define the two pillars of Identity.

* **Authentication (AuthN):** *Who are you?* 
  * Verifying identity. This is the login screen. You prove who you are by providing a password, a fingerprint, or a one-time code.
* **Authorization (AuthZ):** *What are you allowed to do?* 
  * Verifying permissions. Once we know who you are, we check if you have the rights to perform an action (e.g., "Is John allowed to delete the database?").

---

#### 2. Authentication Flow 1: Session & Cookies (Stateful)

This is the traditional, battle-tested way to log a user in. It is called **"Stateful"** because the backend server must remember the state (the session) of every logged-in user in its own memory or database.

##### How it Works
1. The user sends their email and password.
2. The server verifies it.
3. The server generates a random string of gibberish (e.g., `session_id: xyz123`).
4. The server saves `xyz123 = User ID 5` in its Database (or Redis).
5. The server sends `xyz123` back to the browser, wrapping it in an `HttpOnly` Cookie.
6. The browser automatically attaches this Cookie to every single future request.

```mermaid
sequenceDiagram
    participant B as Web Browser
    participant S as Node.js Server
    participant DB as Database / Redis

    Note over B, DB: 1. The Login Phase
    B->>S: POST /login { email, password }
    S->>DB: Check if password hash matches
    DB-->>S: Match Successful! User ID: 5
    S->>S: Generate Session ID (xyz123)
    S->>DB: SAVE: Session xyz123 belongs to User 5
    S-->>B: HTTP 200 OK + Set-Cookie: session=xyz123
    
    Note over B, DB: 2. Subsequent Requests Phase
    B->>S: GET /my-profile (Cookie: session=xyz123)
    S->>DB: Who does session xyz123 belong to?
    DB-->>S: That is User 5
    S-->>B: HTTP 200 OK (User 5's Profile Data)
```

* **Pros:** Highly secure. Very easy to log a user out (you just delete the session from the DB).
* **Cons:** Hard to scale. If you have 50 backend servers, every single request forces the server to do a slow database lookup just to see if the user is logged in.

---

#### 3. Authentication Flow 2: JSON Web Tokens (Stateless)

To solve the scaling issue of Sessions, the industry moved to **JWTs (JSON Web Tokens)**.
It is **"Stateless"** because the backend database does NOT need to remember anything. The token itself contains all the proof.

##### The Anatomy of a JWT
A JWT is just a long string with three parts separated by dots: `Header.Payload.Signature`
* **Header:** Says "I am a JWT".
* **Payload:** The actual JSON data (e.g., `{"userId": 5, "role": "admin"}`). *Anyone can decode and read this, do not put passwords here!*
* **Signature:** A cryptographic hash created using a `SECRET_KEY` that ONLY the backend knows. 

##### How it Works
The backend creates the token, signs it, and gives it to the user. When the user sends it back, the backend doesn't check the database. It just checks if the cryptographic signature is mathematically valid using its `SECRET_KEY`.

```mermaid
sequenceDiagram
    participant B as Web Browser
    participant S as Node.js Server
    participant DB as Database

    Note over B, DB: 1. The Login Phase
    B->>S: POST /login { email, password }
    S->>DB: Check password hash
    DB-->>S: Match Successful! User ID: 5
    S->>S: Create JWT Payload { userId: 5 }
    S->>S: Sign JWT using SECRET_KEY
    S-->>B: HTTP 200 OK + Return JWT String
    
    Note over B, DB: 2. Subsequent Requests Phase
    B->>S: GET /my-profile (Header: Authorization: Bearer <JWT>)
    S->>S: Mathematically verify JWT Signature using SECRET_KEY
    Note over S: Signature is valid! I trust the payload. No DB lookup needed!
    S-->>B: HTTP 200 OK (User 5's Profile Data)
```

##### The Flaw of JWTs: You Cannot Log Out
Because the backend doesn't save the JWT in a database, it has no way to cancel or "revoke" a JWT. If a hacker steals your JWT, they are logged in as you forever.

##### The Fix: Access Tokens + Refresh Tokens
To fix the flaw, you use TWO tokens:
1. **Access Token (JWT):** Lives for only **15 minutes**. Used for API calls. If stolen, the hacker only has 15 minutes.
2. **Refresh Token (Opaque String):** Lives for **30 days**. Saved in the Database. Used ONLY to get a new Access Token when the old one expires.

If you want to ban a user, you delete their Refresh Token from the database. After 15 minutes, their Access Token dies, and they are kicked out forever.

---

#### 4. Authentication Flow 3: OAuth 2.0 (Single Sign-On)

When you see a **"Login with Google"** button, that is OAuth 2.0. 
It allows your website (The Client) to access a user's data from Google (The Resource Server) without the user ever giving you their Google password.

##### The OAuth Authorization Code Flow
This is one of the most complex, but most important backend flows to understand.

```mermaid
sequenceDiagram
    participant U as User
    participant App as Your Node.js App
    participant Auth as Google Auth Server
    participant API as Google API (Resource)

    U->>App: Clicks "Login with Google"
    App->>U: Redirects browser to google.com/auth
    U->>Auth: User logs into Google & clicks "Allow App"
    Auth->>App: Redirects back to your App with an "Authorization Code"
    
    Note over App, Auth: App now securely talks directly to Google Server-to-Server
    App->>Auth: "Here is the Code, and here is my App's Secret Password."
    Auth->>App: "Looks good! Here is an Access Token."
    
    App->>API: GET /profile (using the Access Token)
    API->>App: Returns User's Email & Name
    App->>U: Logs User into your app!
```

---

#### 5. Authorization (AuthZ): Who can do what?

Once a user is authenticated, how do you manage what buttons they are allowed to click?

##### Role-Based Access Control (RBAC)
The industry standard. You don't assign permissions to users; you assign permissions to **Roles**, and you assign Roles to **Users**.

**The Database Structure for RBAC:**
You need 3 tables to do this properly:
1. `Users` table (id, name).
2. `Roles` table (id, name) e.g., "Admin", "Editor", "Viewer".
3. `User_Roles` mapping table (user_id, role_id).

```mermaid
erDiagram
    USERS ||--o{ USER_ROLES : has
    ROLES ||--o{ USER_ROLES : granted_to
    
    USERS {
        int id PK
        string name
    }
    ROLES {
        int id PK
        string role_name
    }
    USER_ROLES {
        int user_id FK
        int role_id FK
    }
```

##### Attribute-Based Access Control (ABAC)
RBAC falls apart when rules get complex. For example: *"A user can only edit this document if they are an Editor AND if the document belongs to their specific department AND if it is between 9 AM and 5 PM."*

In ABAC, you write dynamic `if/else` logic in your backend middleware that checks the attributes of the User, the Resource, and the Environment before allowing the request.
