### Backend Foundation 4b: Backend Performance

Caching is incredible, but it only speeds up *reading* data. 
What happens when you need to run heavy CPU tasks? Or when your Node.js server itself runs out of memory?

Welcome to the world of Architecture Scaling.

---

#### 1. Vertical vs. Horizontal Scaling

When your single Node.js server maxes out at 100% CPU, you have two choices:

* **Vertical Scaling (Scaling Up):** You turn off your $20/month cloud server, and pay for a $1,000/month super-server with 64 CPU Cores and 256GB of RAM.
  * *Pros:* Easy. No code changes required.
  * *Cons:* There is a physical limit. Eventually, you cannot buy a bigger computer. It also represents a Single Point of Failure (if that one server crashes, the whole company goes offline).
* **Horizontal Scaling (Scaling Out):** You keep your small $20/month server, but you buy 50 of them and run the exact same Node.js code on all of them simultaneously.
  * *Pros:* Infinite scaling. High availability (if 5 servers crash, 45 are still running!).
  * *Cons:* Extremely complex. How do users know which of the 50 servers to talk to?

---

#### 2. The Load Balancer

To achieve Horizontal Scaling, you must use a **Load Balancer** (like Nginx, HAProxy, or AWS ALB).

The Load Balancer is a single, extremely fast server that sits in front of your 50 Node.js servers. 
When a user goes to `google.com`, they actually connect to the Load Balancer. The Load Balancer looks at the 50 backend servers, picks one that isn't busy, and invisibly forwards the request to it.

```mermaid
sequenceDiagram
    participant User
    participant LB as Load Balancer
    participant S1 as Server 1
    participant S2 as Server 2
    participant S3 as Server 3

    User->>LB: GET /api/data
    Note over LB: Uses "Round Robin" to pick the next server
    LB->>S1: Forward to Server 1
    S1-->>LB: Returns Data
    LB-->>User: Returns Data to User

    User->>LB: GET /api/data
    Note over LB: Server 1 is busy, pick Server 2
    LB->>S2: Forward to Server 2
    S2-->>LB: Returns Data
    LB-->>User: Returns Data to User
```

##### Routing Algorithms
How does the Load Balancer choose a server?
1. **Round Robin:** Takes turns. Server 1, then Server 2, then Server 3, then back to Server 1.
2. **Least Connections:** Looks for the server currently handling the fewest active users.
3. **IP Hash:** Looks at the User's IP Address. It ensures that a specific user *always* gets routed to the exact same server (useful if you are heavily relying on in-memory Node.js state, though you shouldn't do that).

---

#### 3. Asynchronous Processing (Message Queues)

If a user uploads a 4K video, it might take your server 5 minutes to compress it. 
Because Node.js is single-threaded, if a server spends 5 minutes compressing a video, **it cannot respond to any other users for 5 minutes.**

> [!WARNING]
> **The Golden Rule of APIs:** Never block the HTTP Request. An API endpoint should respond in under 200 milliseconds. 

**The Fix:** You use a **Message Queue** (like RabbitMQ, Apache Kafka, or Redis BullMQ).

##### The Publisher/Subscriber Architecture
Instead of the web server processing the video, it acts as a **Publisher**. It drops a "Task Ticket" into the Message Queue and instantly responds to the user.
Deep in your backend, you run special "Worker" servers (the **Subscribers**). They watch the queue, pull the tickets, and do the heavy 5-minute processing in the background without affecting the web traffic!

```mermaid
sequenceDiagram
    participant User
    participant Web as Web Server
    participant MQ as Message Queue (RabbitMQ)
    participant Worker as Background Worker

    User->>Web: POST /upload-video
    Web->>MQ: Publish Task: "Compress Video #10"
    Web-->>User: HTTP 202 Accepted (Processing started...)
    
    Note over MQ, Worker: Asynchronously, in the background
    Worker->>MQ: Pulls Task: "Compress Video #10"
    Note over Worker: Spends 5 minutes compressing...
    Worker->>Worker: Done! Send email to user.
```

---

#### 4. Database Performance Hacks

If you have scaled your backend horizontally and added caches, your Database is the final bottleneck.

##### Connection Pooling
Opening a new connection to a PostgreSQL database takes a massive amount of CPU and time (the TCP Handshake, Authentication, etc). 
If 1,000 users hit your server, you DO NOT want to open 1,000 connections. 
Instead, you use a **Connection Pool**. The backend opens 20 connections when it boots up and keeps them open forever. When a user needs the database, they "borrow" a connection from the pool, use it, and return it.

##### Database Indexing (Recap)
Never forget: If a query is slow, 90% of the time, you forgot to create an Index. 
An Index is a B-Tree data structure that allows the database to find a row in `O(log n)` time instead of scanning every single row in the table (`O(n)`).

---

#### 5. Network Payload Compression (Gzip / Brotli)

Sometimes the backend is fast, but the user's internet is slow. 
If your API returns a massive 5MB JSON array of 10,000 products, it will take a long time to download over a 3G mobile network.

**The Fix:** You configure your Node.js server (or Nginx Load Balancer) to compress the HTTP response using algorithms like **Gzip** or Google's **Brotli**.
Text files (like HTML, CSS, JavaScript, and JSON) are highly compressible. A 5MB JSON file can easily shrink to 500KB before it flies across the internet, making your API feel 10x faster to the end-user! The user's browser automatically unzips it the millisecond it receives it.
