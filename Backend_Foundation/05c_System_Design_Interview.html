### Backend Foundation 5c: System Design Interview

When you interview for a Senior Backend Engineering role at a top tech company, you will face the System Design Interview. You will be given a whiteboard and 45 minutes to design a massive, global application from scratch.

This file provides the framework and the case studies to pass it.

---

#### 1. The 4-Step Interview Framework

Never just start drawing boxes. Follow this exact framework to show seniority.

##### Step 1: Requirements Gathering (5 mins)
Clarify the scope. 
* **Functional:** "Can users upload videos? Can they comment? Can they livestream?"
* **Non-Functional:** "Does this need to be Highly Available or Highly Consistent? What is the expected Daily Active User (DAU) count?"

##### Step 2: Back-of-the-Envelope Estimations (5 mins)
Do the math out loud.
* "If we have 10M users uploading a 1MB photo a day, that is 10TB of storage per day. Therefore, we cannot use a single SQL database. We must use a distributed Blob Storage system like AWS S3."

##### Step 3: High-Level Design (15 mins)
Draw the core components: Client -> API Gateway -> Load Balancer -> Microservices -> Cache -> Database.

##### Step 4: Deep Dive & Trade-offs (20 mins)
This is where you pass or fail. The interviewer will ask: *"What happens if Justin Bieber joins and gets 100M followers? How does your system handle it?"* 
You must identify Single Points of Failure (SPOFs) and explain your architectural trade-offs.

---

#### Case Study 1: Design Twitter (The News Feed)

**The Problem:** Generating a user's timeline by joining the tweets of the 500 people they follow takes too long in a SQL database.

**The Solution:** The "Fanout" Architecture.

##### 1. Fanout on Write (Push Model)
When a normal user tweets, the backend does NOT just save the tweet to a database. It actively pushes the tweet into a Redis List (Timeline Cache) for *every single person* who follows them.
* **Pros:** When a follower opens Twitter, reading their feed is instantaneous `O(1)` because it is pre-computed in Redis.
* **Cons:** If Justin Bieber (100M followers) tweets, the backend tries to push that tweet into 100,000,000 Redis caches at the exact same time. The server crashes (The Celebrity Problem).

##### 2. Fanout on Read (Pull Model) for Celebrities
To solve the celebrity problem, you use a Hybrid model.
Normal users use Fanout-on-Write. But if an account has > 100k followers, you skip the push. Instead, when a follower opens their app, the backend *pulls* the celebrity's tweets dynamically and merges them with the Redis cache.

---

#### Case Study 2: Design WhatsApp (Chat System)

**The Problem:** HTTP is stateless and unidirectional (the client asks, the server answers). How does the server push a chat message to a phone without the phone asking?

**The Solution:** WebSockets.

##### The Architecture
1. **The Persistent Connection:** When a user opens WhatsApp, their phone establishes a stateful, persistent **WebSocket** connection to a specific Chat Server.
2. **The Session Manager:** Because you have 10,000 Chat Servers, you need a Redis database (Session Manager) that remembers: *"User A's WebSocket is connected to Server #402."*
3. **The Message Flow:**
   * User A sends a message to User B.
   * The message hits Server #402.
   * Server #402 checks the Session Manager: *"Where is User B?"*
   * Session Manager replies: *"User B is on Server #911."*
   * Server #402 puts the message into a **Message Queue (Kafka)**.
   * Server #911 reads Kafka, finds the message, and pushes it down the open WebSocket directly to User B's phone.

```mermaid
sequenceDiagram
    participant A as User A Phone
    participant S1 as Chat Server 402
    participant Redis as Session Manager
    participant MQ as Kafka Event Bus
    participant S2 as Chat Server 911
    participant B as User B Phone

    Note over A, S1: Persistent WebSocket
    Note over B, S2: Persistent WebSocket

    A->>S1: Send Message to B
    S1->>Redis: "Which server holds User B?"
    Redis-->>S1: "Server 911"
    
    S1->>MQ: Publish: Route to Server 911
    MQ->>S2: Consume Message
    S2->>B: Push Message instantly via WebSocket
```

#### Case Study 3: Design YouTube (Video Streaming)

**The Problem:** Videos are massive files. If you stream a 1GB video from a SQL database, the database will instantly die.

**The Solution:** Splitting Metadata from Binary Data.

##### The Architecture
1. **Metadata Storage:** Title, Views, Likes, and Comments are stored in a standard **PostgreSQL** or **MongoDB** database, heavily cached with Redis.
2. **Binary Storage (Blob):** The actual `.mp4` video file is saved to an Object Store (like **AWS S3**). 
3. **The CDN (Content Delivery Network):** Streaming from AWS S3 is still too slow globally. The video files are aggressively pushed to Edge CDN servers (Cloudflare) in 200 cities around the world. 
4. **Adaptive Bitrate Streaming:** When a user watches a video, the CDN doesn't send the whole 1GB file. The video is chopped into 5-second "chunks". The video player downloads chunk 1 in 1080p. If the user's internet slows down, the player requests chunk 2 in 480p automatically.

<div class="cheat-sheet">
<h4>The Ultimate System Design Cheat Sheet</h4>
<p>In an interview, when the interviewer gives you a requirement, instantly map it to the correct technology:</p>
<ul>
    <li>Need <strong>insanely fast reads</strong> for heavily requested data? &rarr; <strong>Redis / Memcached</strong></li>
    <li>Need to store <strong>massive files</strong> (images, videos, PDFs)? &rarr; <strong>AWS S3 (Blob Storage)</strong></li>
    <li>Need to run <strong>heavy background tasks</strong> without blocking the API? &rarr; <strong>RabbitMQ / Kafka (Message Queues)</strong></li>
    <li>Need strict <strong>financial accuracy (ACID)</strong> and relationships? &rarr; <strong>PostgreSQL / MySQL</strong></li>
    <li>Need <strong>flexible schemas</strong> and massive horizontal write scaling? &rarr; <strong>MongoDB / Cassandra / DynamoDB</strong></li>
    <li>Need <strong>full-text fuzzy searching</strong> (like Google)? &rarr; <strong>Elasticsearch</strong></li>
    <li>Need to stream data to a client in <strong>real-time</strong>? &rarr; <strong>WebSockets / Server-Sent Events (SSE)</strong></li>
    <li>Need to speed up loading times for <strong>global users</strong>? &rarr; <strong>CDN (Cloudflare / CloudFront)</strong></li>
</ul>
