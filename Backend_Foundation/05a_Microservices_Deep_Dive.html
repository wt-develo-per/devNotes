### Backend Foundation 5a: Microservices & Cloud Native Deep Dive

In a massive architecture, breaking a monolith into 20 Microservices solves the problem of code organization, but it creates a massive nightmare for deployment and networking.

This file covers how FAANG companies manage the chaos of Microservices.

---

#### 1. Communication (REST vs. gRPC)

When the User talks to your API Gateway, they use standard HTTP and JSON (REST). 
But when your `UserService` needs to talk to your `PaymentService` entirely inside your private datacenter, using JSON is incredibly slow. 

* **The Problem with JSON:** Parsing JSON objects takes CPU power. Furthermore, JSON sends massive amounts of redundant text strings across the network.
* **The Solution: gRPC & Protocol Buffers:** Developed by Google. Instead of sending JSON, microservices talk to each other using gRPC. Data is serialized into dense, binary 1s and 0s using "Protocol Buffers." 
  * It is up to 10x faster than REST.
  * It is strictly typed (if a service expects an Integer and gets a String, it fails instantly before sending the request).

```mermaid
sequenceDiagram
    participant User
    participant Gate as API Gateway
    participant S1 as User Microservice
    participant S2 as Payment Microservice

    User->>Gate: GET /checkout (Standard JSON via HTTP)
    Gate->>S1: Routes Request (JSON)
    S1->>S2: Internal Request (gRPC Binary over HTTP/2)
    Note over S1, S2: Blazing fast binary communication
    S2-->>S1: Response (gRPC Binary)
    S1-->>Gate: Resolves data
    Gate-->>User: Returns JSON response
```

---

#### 2. Containerization (Docker)

*"It works on my machine!"* 

This is the oldest excuse in programming. Your Node.js code works on your Windows laptop, but crashes when you upload it to an Ubuntu cloud server because the server has the wrong version of Node installed.

**The Fix:** Docker.
Docker allows you to wrap your Node.js code, the exact `package.json` dependencies, and a tiny, stripped-down Linux Operating System into a single box called a **Container**.
You give that Container to the Cloud Server. Because the Container brings its own Operating System with it, it is guaranteed to run identically everywhere on Earth.

---

#### 3. Orchestration (Kubernetes / k8s)

Docker is great for running 1 container. But what if you need to run **5,000 containers** across 200 physical servers?

How do you load balance them? What if a server catches on fire? How do you update all 5,000 containers without turning the website off?

**The Fix:** Kubernetes (invented by Google).
Kubernetes is the "Operating System of the Cloud." You don't manually start servers anymore. You write a YAML file that says: *"I want 50 copies of my Payment Service running at all times."*
* **Self-Healing:** If a physical server explodes, Kubernetes notices 10 containers died, and instantly boots up 10 new containers on a healthy server to replace them.
* **Service Discovery:** Kubernetes gives every microservice an internal DNS name. The `UserService` can literally just make an HTTP call to `http://payment-service/`, and Kubernetes automatically routes the traffic to the healthiest container.

---

#### 4. Resiliency: The Circuit Breaker Pattern

In a Microservice architecture, failure is guaranteed. 

Imagine your `CartService` needs to talk to your `InventoryService`. 
Suddenly, the `InventoryService` crashes. 
The `CartService` makes a network request to it, but because the service is broken, the network request hangs for 30 seconds before Timing Out. 
If 1,000 users add items to their carts, the `CartService` hangs 1,000 times, runs out of memory, and crashes too! This is called a **Cascading Failure**.

**The Fix:** The Circuit Breaker Pattern.
You wrap all external network calls in a "Circuit Breaker" algorithm. 

1. **Closed (Normal):** Traffic flows normally.
2. **Open (Failing):** If the Circuit Breaker detects that 5 requests to the Inventory Service failed in a row, the Circuit "Trips Open". For the next 60 seconds, it completely stops sending requests to the Inventory Service. It instantly returns a Fallback Error (e.g., "Inventory currently unavailable") so the Cart Service doesn't hang!
3. **Half-Open (Testing):** After 60 seconds, it lets 1 request through to test if the Inventory Service fixed itself. If it works, the Circuit closes again!

```mermaid
sequenceDiagram
    participant Cart as Cart Service
    participant CB as Circuit Breaker (Logic)
    participant Inv as Inventory Service

    Cart->>CB: Check Inventory for item
    CB->>Inv: Request
    Inv-->>CB: ERROR (Timeout)
    
    Note over CB: 5 errors later... The Circuit TRIPS OPEN!
    
    Cart->>CB: Check Inventory for item
    Note over CB: Circuit is OPEN. Immediately reject!
    CB-->>Cart: Fallback Response ("Inventory unknown")
    Note over Cart: Cart Service is saved from hanging!
```

---

#### 5. Serverless Architecture (AWS Lambda)

Managing Kubernetes clusters is expensive and requires dedicated DevOps engineers.
What if you don't want to manage servers at all?

Enter **Serverless (Function as a Service - FaaS)**.
Instead of writing an Express app that runs 24/7, you upload a single JavaScript function to AWS. 

* When a user visits a URL, AWS automatically provisions a tiny micro-server, runs your function, returns the response, and then destroys the server. 
* **Pros:** Infinite scaling instantly. If 0 users visit, you pay $0.00.
* **Cons:** The "Cold Start." Because AWS has to boot up a new server when a user hits your function, the very first user might experience a 1 or 2-second delay while the environment starts up.
