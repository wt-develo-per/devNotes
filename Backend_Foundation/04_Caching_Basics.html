### Backend Foundation 4: Caching Basics

You have structured your database, secured your APIs, and written your backend logic. But what happens when 1,000,000 users all visit the homepage at the exact same second? 

Your database will instantly crash. To solve this, you need the ultimate weapon of backend performance: **Caching**.

---

#### 1. The Cost of Data (Why databases are slow)

To understand caching, you must understand computer hardware.
Your SQL or MongoDB database is ultimately saved to a **Hard Drive (Disk)** so the data survives a power outage (Durability). 

Fetching data from a Hard Drive is incredibly slow. Fetching data from **RAM (Memory)** is incredibly fast (often thousands of times faster).

> [!NOTE]
> **The Philosophy of Caching:** 
> Do not ask the slow Hard Drive for the same information twice. Ask it once, save the answer in the fast RAM, and give the next 10,000 users the answer directly from RAM!

---

#### 2. In-Memory Datastores (Redis & Memcached)

Because Node.js servers restart often and have limited memory, we don't usually cache things directly in Node.js. Instead, we use dedicated "In-Memory Datastores."

* **Redis:** The absolute industry standard. It is a blazing-fast, NoSQL Key-Value database that lives entirely in RAM. It supports strings, lists, and advanced data structures.
* **Memcached:** The older, simpler alternative. It only handles simple string key-value pairs. 

In 99% of modern backend architectures, **Redis** is the cache of choice.

---

#### 3. Caching Strategy 1: Cache-Aside (Lazy Loading)

This is the most common caching strategy in the world. 
The application code takes full responsibility for reading and writing from the cache. The Cache does not talk directly to the Database.

##### The Flow:
1. User requests a profile.
2. Backend checks Redis: "Do you have the profile?" (Cache Miss).
3. Backend asks the Database. Database returns the profile.
4. Backend gives the profile to Redis and says, "Remember this for next time."
5. Next user requests the profile. Backend asks Redis.
6. Redis returns it instantly (Cache Hit). The Database is never touched!

```mermaid
sequenceDiagram
    participant App as Node.js Backend
    participant Cache as Redis Cache
    participant DB as PostgreSQL Database

    App->>Cache: 1. Do you have the profile?
    Cache-->>App: 2. No (Cache Miss)
    App->>DB: 3. Query profile from DB
    DB-->>App: 4. Return profile data
    App->>Cache: 5. Save profile to Cache for next time
```

**Pros:** Extremely resilient. If Redis crashes, the application still works (it just falls back to querying the slow database).
**Cons:** The very first user to request data always experiences a slow load time (The Cache Miss).

---

#### 4. Caching Strategy 2: Write-Through

In a Write-Through cache, the application treats the Cache as the main data store. 
When the backend saves data, it saves it directly to the Cache, and the Cache immediately turns around and saves it to the Database.

##### The Flow:
1. User updates their profile.
2. Backend saves the update to Redis.
3. Redis saves the update to PostgreSQL.
4. The backend is notified that the save is complete.

```mermaid
sequenceDiagram
    participant App as Node.js Backend
    participant Cache as Redis Cache
    participant DB as PostgreSQL Database

    App->>Cache: 1. Save updated profile data
    Cache->>DB: 2. Immediately save update to DB
    DB-->>Cache: 3. DB save complete
    Cache-->>App: 4. Cache save complete
```

**Pros:** Data in the cache is *always* perfectly up-to-date. You never have a "Cache Miss."
**Cons:** Every single write operation requires writing to two places, slowing down `POST` and `PUT` requests.

---

#### 5. Time to Live (TTL) & Stale Data

Caching creates a massive new problem: **Stale Data**.

If you cache a user's Instagram followers count in Redis, and then they gain a new follower, Redis still holds the old number. Redis is serving "stale" (outdated) data!

To fix this, we attach a **TTL (Time To Live)** to every item we put in the cache. 
A TTL is a countdown timer. 

* *Example:* `redis.set('followers_count', 500, 'EX', 60)`
* This means: Save the number 500 in Redis, but **expire (delete) it after exactly 60 seconds.**

When the 60 seconds are up, the data vanishes. The next user who asks for the follower count will cause a "Cache Miss", forcing the backend to query the database and fetch the true, updated number.

---

#### 6. Cache Eviction Policies (When RAM runs out)

RAM is incredibly expensive. You might only have 4GB of RAM in your Redis server, but 100GB of data in your PostgreSQL database. 
You cannot cache everything.

When Redis hits 100% memory usage, it must delete old data to make room for new data. It does this using an **Eviction Policy**:

1. **LRU (Least Recently Used):** *The Industry Standard.* Redis deletes the data that hasn't been requested in the longest amount of time. If a cached article hasn't been read in 3 days, delete it!
2. **LFU (Least Frequently Used):** Redis deletes the data that is requested the fewest total number of times.
3. **FIFO (First In, First Out):** Redis blindly deletes the oldest data, regardless of how popular it is. (Rarely used).
